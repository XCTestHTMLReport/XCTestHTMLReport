name: Generate Test Artifacts

on:
  workflow_dispatch:

# Only reads the tree. The repository default is write, so scope the token
# down explicitly rather than inheriting more than is needed.
permissions:
  contents: read

jobs:
  create_test_data:
    strategy:
      fail-fast: false
      matrix:
        xcode_version: [latest-stable, 15]
        # macos_version: [macos-13, macos-12]
        # exclude:
        #   # macos 12 "Monterey" is only supported up to Xcode 14.2
        #   - xcode_version: 14.3
        #     macos_version: macos-12
        #   # macos 13 "Ventura" builders don't have Xcode 13
        #   - xcode_version: 13.2.1
        #     macos_version: macos-13
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ matrix.xcode_version }}

      - name: Prepare Test Results
        env:
          XCODE_VERSION: ${{ matrix.xcode_version }}
        shell: bash
        run: ./prepareTestResults.sh

      - name: Archive Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sample-test-results-${{ matrix.macos_version }}-${{ matrix.xcode_version }}
          path: Tests/XCTestHTMLReportTests/Resources
