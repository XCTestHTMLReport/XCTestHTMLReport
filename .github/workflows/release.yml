name: Release

on:
  push:
   tags:
   - '[0-9]+.[0-9]+.[0-9]+'
   - '[0-9]+.[0-9]+.[0-9]+rc[0-9]+'
  # Lets the whole build/sign/package path be exercised without publishing
  # anything. Before this existed the only way to test a release was to cut one.
  #
  # A manual run is always a dry run: there is no input that makes it publish.
  # The `release` and `bump_version` jobs run on a tag push and on nothing
  # else. (There used to be a `dry_run` checkbox here. Nothing read it, and
  # unticking it changed nothing, which is not what a checkbox promises.)
  #
  # It has to be run from `main`. The `sign` job below belongs to the
  # `release` environment, which admits `main` and release tags only; from
  # any other ref the build still runs, and the `sign` job is refused before
  # its first step.
  workflow_dispatch:
    inputs:
      notarize:
        type: boolean
        default: false
        description: "Also submit the dry-run build to Apple's notary service, and check the ticket. Nothing is published either way."

# Declared per job rather than at workflow level, so no job silently inherits
# a grant it does not need: the build and the signing job only read,
# publishing writes releases, and the version bump also opens a pull request.
#
# Building and signing are separate jobs on separate machines, on purpose.
# `swift build` compiles this package and its third-party dependencies --
# build plugins and macros included -- and the version check then runs the
# result, all as the runner's one user. A process started by any of that can
# outlive the step that started it, so no ordering of steps inside one job can
# promise that built code is gone by the time a signing keychain is unlocked.
# A second runner can: `build` holds no secret and belongs to no environment,
# and `sign` starts on a fresh machine, takes the binary as an artifact, and
# never executes it or anything else the build produced.
jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      version: ${{ steps.metadata.outputs.version }}
      base_version: ${{ steps.metadata.outputs.base_version }}
      unsigned_sha256: ${{ steps.digest.outputs.sha256 }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Nothing in this job pushes. bump_version's checkout keeps its
        # credentials, because create-pull-request pushes a branch from it.
        persist-credentials: false

    - name: Setup Xcode version
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    - name: Generate Metadata
      id: metadata
      run: |
        if [[ "$GITHUB_REF" =~ ^refs/tags/ ]]; then
          VERSION="${GITHUB_REF#refs/tags/}"
        else
          VERSION="0.0.0-dryrun"
        fi
        # `rc` tags carry no hyphen in the X.Y.ZrcN form this repo uses, so a
        # `contains(github.ref, '-')` test never fired for them and release
        # candidates shipped as full releases.
        if [[ "$VERSION" == *rc* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
        # Release notes are kept per X.Y.Z, so every candidate publishes the
        # same document as the final release and the two cannot drift:
        # 4.0.0rc1 and 4.0.0 both resolve to docs/release-notes/4.0.0.md.
        BASE="${VERSION%%rc*}"
        {
          echo "version=${VERSION}"
          echo "base_version=${BASE}"
          echo "prerelease=${PRERELEASE}"
          echo "bin_path=.build/universal/release/xchtmlreport"
        } >> "$GITHUB_OUTPUT"

    - name: Stamp version into the binary
      # Version.swift was only ever written by the post-release bump job, so the
      # released binary reported whatever happened to be on main rather than the
      # tag it was built from. Stamping here makes `--version` match the tag.
      run: |
        echo "let version = \"${{ steps.metadata.outputs.version }}\"" \
          > Sources/XCTestHTMLReport/Version.swift
        cat Sources/XCTestHTMLReport/Version.swift

    - name: Build (arm64)
      run: swift build -v -c release --triple arm64-apple-macosx

    - name: Build (x86_64)
      run: swift build -v -c release --triple x86_64-apple-macosx

    - name: Lipo
      run: |
        mkdir -p .build/universal/release && \
        lipo -create -output ${{ steps.metadata.outputs.bin_path }} \
        .build/arm64-apple-macosx/release/xchtmlreport \
        .build/x86_64-apple-macosx/release/xchtmlreport
        lipo -info ${{ steps.metadata.outputs.bin_path }}

    - name: Verify the built binary reports the tagged version
      run: |
        REPORTED=$(${{ steps.metadata.outputs.bin_path }} --version)
        echo "reported: ${REPORTED}"
        if [[ "${REPORTED}" != "${{ steps.metadata.outputs.version }}" ]]; then
          echo "::error::binary reports '${REPORTED}' but this is release '${{ steps.metadata.outputs.version }}'"
          exit 1
        fi

    # The version check above stays in this job because it runs the binary,
    # which the signing job must never do. The digest is how the signing job
    # knows the file it was handed is the one that passed that check.
    - name: Record the unsigned binary's digest
      id: digest
      env:
        BIN_PATH: ${{ steps.metadata.outputs.bin_path }}
      run: |
        SHA256="$(shasum -a 256 "$BIN_PATH" | awk '{ print $1 }')"
        echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
        echo "unsigned xchtmlreport: ${SHA256}"
        # Out of .build before it is uploaded: upload-artifact skips anything
        # under a dot-directory unless told otherwise, and would report an
        # empty upload rather than this file.
        mkdir -p unsigned
        cp "$BIN_PATH" unsigned/xchtmlreport

    # Kept for a day: it exists to cross from this runner to the next one,
    # and the signed archive is the artifact anyone should download.
    - name: Hand the unsigned binary to the signing job
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: unsigned
        path: unsigned/xchtmlreport
        if-no-files-found: error
        retention-days: 1

  sign:
    runs-on: macos-latest
    needs: build
    # The signing certificate and the notarization key are secrets of this
    # environment, not of the repository, and this is the only job in it.
    #
    # WHAT THAT CLOSES. A repository secret is readable by a workflow run from
    # any branch, so anyone with write access could push a branch that edits
    # this file and walk away with a Developer ID key -- or dispatch this
    # workflow from that branch and download a signed, notarized build of it.
    # The environment's deployment rule admits the `main` branch and tags
    # matching `*.*.*`, and GitHub refuses this job for any other ref before
    # a single step runs. `*.*.*` covers every tag the trigger above can fire
    # on (4.1.0, 4.1.0rc1), and would cover v4.1.0 and v4.1.0-rc.1 as well.
    #
    # WHAT IT DOES NOT. A tag push runs this workflow as it stands in the
    # tagged commit, and the rule admits any tag of that shape, whatever
    # commit it points at. So a person who can push a tag can tag a commit of
    # their own, off `main`, carrying an edited copy of this file, and this job
    # will hand it the secrets. Nothing in this repository's files can stop
    # that; it is closed in the repository's settings, by a tag ruleset that
    # restricts who may create tags matching `*.*.*`, or by a required
    # reviewer on the environment. docs/releasing.md describes both.
    #
    # WHAT THIS JOB TRUSTS. Its own steps: this file and
    # scripts/release/check_credentials.sh, both as of the ref being run, plus
    # the three GitHub-owned actions below and the tools on the runner image.
    # It does not build, and it does not run the binary it signs.
    environment: release
    permissions:
      contents: read
    env:
      # The archive unpacks as release/xchtmlreport, as it always has: that
      # was the binary's parent directory under .build/universal/.
      BIN_PATH: release/xchtmlreport
      ARCHIVE: xchtmlreport-${{ needs.build.outputs.version }}.zip

    steps:
    # Only the credential script. Nothing else in the tree is needed to sign,
    # and what is not checked out cannot be run by mistake.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: scripts/release

    # Names the credential that says no: missing, expired, wrong password,
    # exported without its key, or refused by Apple -- every one of them, not
    # just the first. The script imports the certificate into a keychain of
    # its own with a few `security` calls, which is all the third-party import
    # action was doing; that action reported an expired certificate as a
    # success, leaving codesign to say "no identity found".
    #
    # In this mode it checks and then deletes: the keychain and the decoded
    # key are gone again before the step ends.
    #
    # A dry run therefore answers two questions separately: `build` says
    # whether the release build still works, and this says whether it can be
    # signed and notarized.
    - name: Check release credentials
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      run: ./scripts/release/check_credentials.sh check

    - name: Fetch the unsigned binary
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: unsigned
        path: release

    # The artifact store keeps contents, not permissions, so the executable
    # bit has to be put back. The digest is checked first: what gets signed is
    # the file the build job measured after its version check, or nothing.
    - name: Check it is the binary the build job produced
      env:
        EXPECTED: ${{ needs.build.outputs.unsigned_sha256 }}
      run: |
        ACTUAL="$(shasum -a 256 "$BIN_PATH" | awk '{ print $1 }')"
        if [[ -z "$EXPECTED" || "$ACTUAL" != "$EXPECTED" ]]; then
          echo "::error::the downloaded binary is ${ACTUAL}, but the build job produced ${EXPECTED:-nothing}"
          exit 1
        fi
        chmod 755 "$BIN_PATH"
        lipo -info "$BIN_PATH"

    - name: Import the signing certificate
      id: signing
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      run: ./scripts/release/check_credentials.sh signing

    # By the SHA-1 the import step read out of its own keychain, rather
    # than by "Developer ID Application: <name> (<team id>)". The name matched
    # whatever identity any keychain on the runner happened to offer, and
    # needed the team id kept as a secret to spell it.
    #
    # --options runtime (the hardened runtime) and --timestamp (a secure
    # timestamp from Apple) are both things notarization refuses a binary
    # without. The timestamp is also why a release keeps verifying after the
    # certificate that signed it expires.
    #
    # The keychain is deleted as this step exits, signed or not. Signing is
    # the only thing it is for, and notarization, which can take many minutes
    # and talks to the network, has no business running beside it.
    - name: Sign
      env:
        IDENTITY: ${{ steps.signing.outputs.identity }}
        KEYCHAIN: ${{ steps.signing.outputs.keychain }}
      run: |
        trap 'if [ -e "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN"; fi' EXIT
        codesign --force --options runtime --timestamp \
          --sign "$IDENTITY" --keychain "$KEYCHAIN" "$BIN_PATH"

    - name: Verify
      # --deep is deprecated by Apple and is not the right check for a lone
      # executable; --strict on the binary itself is.
      #
      # A valid signature is not yet one Apple will notarize, so the three
      # properties notarization insists on are asserted here, where a miss is
      # a one-line message rather than a JSON log fetched from the notary
      # service: a Developer ID signer, the hardened runtime, and a secure
      # timestamp (an ad-hoc or untimestamped signature prints "Signed Time="
      # instead of "Timestamp=").
      run: |
        codesign --verify -vvv --strict "$BIN_PATH"
        DETAILS="$(codesign --display -vv "$BIN_PATH" 2>&1)"
        echo "$DETAILS"
        grep -q '^Authority=Developer ID Application: ' <<<"$DETAILS" \
          || { echo "::error::not signed by a Developer ID Application certificate"; exit 1; }
        grep -q '^CodeDirectory .*flags=.*runtime' <<<"$DETAILS" \
          || { echo "::error::signed without the hardened runtime"; exit 1; }
        grep -q '^Timestamp=' <<<"$DETAILS" \
          || { echo "::error::signed without a secure timestamp"; exit 1; }

    # --norsrc --noextattr, because the binary now arrives by download, and
    # macOS can tag a downloaded file with extended attributes that cannot be
    # cleared (com.apple.provenance). ditto would pack those into the archive
    # as a second entry, release/._xchtmlreport. A Mach-O carries its
    # signature inside the file, so nothing the signature needs is left out.
    - name: Package
      run: |
        ditto -c -k --norsrc --noextattr --keepParent "$BIN_PATH" "$ARCHIVE"
        unzip -Z1 "$ARCHIVE"
        shasum -a 256 "$ARCHIVE"

    # Authenticated with an App Store Connect API key, where this used to
    # pass an Apple ID and an app-specific password: the key is scoped to a
    # role, can be revoked on its own, and is not a person's account password.
    #
    # The status is read out of the answer rather than trusted to the exit
    # code: `--wait` promises to wait for a verdict, not to exit non-zero on
    # the verdict "Invalid", and a release must not depend on which it does.
    # On anything but "Accepted" the notary log, which names the offending
    # file and rule, is printed before failing.
    #
    # --timeout 30m is twice the time Apple says 98 percent of submissions
    # take (15 minutes; most take under 5). Without it `--wait` has no limit
    # and a stuck submission holds a macOS runner until the job's six-hour
    # ceiling. Timing out abandons nothing at Apple's end -- the submission
    # carries on -- but this run fails, and re-running it submits the archive
    # again as a new submission. That is harmless: a ticket is keyed to the
    # binary's hash, not to the submission.
    #
    # The key is decoded here, used, and removed when the step exits, so it is
    # on disk for this step alone -- and by now the signing keychain is gone.
    - name: Notarize
      id: notarize
      if: github.event_name == 'push' || inputs.notarize
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      run: |
        NOTARY_KEY="$RUNNER_TEMP/release-notary-key.p8"
        trap 'rm -f "$NOTARY_KEY"' EXIT
        ./scripts/release/check_credentials.sh notary
        auth=(--key "$NOTARY_KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID")
        RESULT="$RUNNER_TEMP/notary-result.json"
        xcrun notarytool submit "$ARCHIVE" "${auth[@]}" \
          --wait --timeout 30m --output-format json > "$RESULT" || true
        cat "$RESULT"; echo
        STATUS="$(plutil -extract status raw -o - "$RESULT" 2>/dev/null || true)"
        ID="$(plutil -extract id raw -o - "$RESULT" 2>/dev/null || true)"
        if [[ "$STATUS" != "Accepted" ]]; then
          if [[ -n "$ID" ]]; then
            xcrun notarytool log "$ID" "${auth[@]}" || true
          fi
          echo "::error::notarization of ${ARCHIVE} ended as '${STATUS:-no answer}', not 'Accepted' (submission ${ID:-none}). Re-running this job submits the archive again."
          exit 1
        fi
        echo "Notarized: submission ${ID}"

    # A ticket cannot be stapled to a bare executable or to a zip -- stapler
    # only takes app bundles, disk images and installer packages -- so
    # Gatekeeper looks this one up online, by the binary's code directory
    # hash, the first time someone runs it. This asks the same question
    # Gatekeeper will, and so fails the release if Apple's answer for the
    # exact binary being shipped is anything but "notarized". A few tries,
    # because the ticket can take a moment to be served after the verdict.
    - name: Verify the notarization ticket
      if: steps.notarize.outcome == 'success'
      run: |
        for attempt in 1 2 3 4 5 6; do
          if codesign --verify --strict -R="notarized" --check-notarization -vv "$BIN_PATH"; then
            # What a user's Mac will say. Informational: the line above is the gate.
            spctl --assess --type install -vvv "$BIN_PATH" || true
            exit 0
          fi
          echo "no ticket yet (attempt ${attempt}); waiting"
          sleep 20
        done
        echo "::error::Apple accepted the submission, but no notarization ticket is being served for the signed binary"
        exit 1

    # always(), so nothing outlives a failed or cancelled run on the runner's
    # disk. The steps above already remove what they write as they go; this
    # is for the run that never got that far. Deleting the keychain also takes
    # it back out of the search list -- and is skipped when there is none,
    # because `security delete-keychain` on a missing path leaves a stray
    # lock file behind.
    - name: Remove signing material
      if: always()
      run: |
        KEYCHAIN="$RUNNER_TEMP/release-signing.keychain-db"
        if [ -e "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
        rm -f "$RUNNER_TEMP/release-signing.p12" "$RUNNER_TEMP/release-notary-key.p8" \
          "$RUNNER_TEMP/notary-result.json"
        rm -rf "$RUNNER_TEMP/release-signing-certs"

    - name: Archive
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: application
        path: ${{ env.ARCHIVE }}

    - name: Dry run summary
      if: github.event_name == 'workflow_dispatch'
      env:
        NOTARIZED: ${{ steps.notarize.outcome }}
      run: |
        {
          echo "### Dry run complete"
          echo "Built, signed and packaged \`${ARCHIVE}\`."
          echo "The signing certificate and the notarization key were both checked."
          if [[ "$NOTARIZED" == "success" ]]; then
            echo "Apple notarized the build and is serving its ticket. Nothing was published."
          else
            echo "Nothing was submitted for notarization, and nothing was published."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

  release:
    runs-on: ubuntu-latest
    # `sign` for the archive; `build` because its outputs are read below.
    needs: [build, sign]
    if: github.event_name == 'push'
    # id-token and attestations are for the provenance attestation below:
    # the first mints the short-lived OIDC token Sigstore signs against, the
    # second stores the result. Neither reaches the `sign` job, which is the
    # one holding the signing certificate.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
    # Sparse and credential-free: the only thing this job wants from the tree
    # is the release-notes document. On a tag push the checkout is the tag, so
    # a release always publishes the notes as they stood at the commit it was
    # cut from rather than whatever main says today.
    - name: Check out the release notes
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: docs/release-notes

    - name: Download
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      # Both are given explicitly because the default layout is not stable and
      # the release step globs against it. Downloading everything unnamed put
      # the archive in a directory per artifact under v4 and puts it straight
      # in the workspace under v8 — the version bump in #404 silently moved it
      # and nothing noticed, because the action this job used to publish with
      # treats an unmatched file pattern as success.
      with:
        name: application
        path: application

    - name: Compose the release body
      id: notes
      env:
        NOTES_FILE: docs/release-notes/${{ needs.build.outputs.base_version }}.md
        PRERELEASE: ${{ needs.build.outputs.prerelease }}
        TAG: ${{ github.ref_name }}
        # The archive the sign job actually produced, so the banner names the
        # asset that is really attached rather than a second guess at it.
        ARCHIVE: xchtmlreport-${{ needs.build.outputs.version }}.zip
      run: |
        # Not every version has a hand-written document, and a missing one is
        # not a reason to fail a release that is already built and notarized —
        # it falls back to the generated notes alone.
        if [[ ! -f "$NOTES_FILE" ]]; then
          echo "::notice::no notes at ${NOTES_FILE}; publishing generated notes alone"
          echo "have_notes=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # A candidate says so at the top of its own release page, where nobody
        # can miss it. The banner is generated per tag rather than written into
        # the document, because the document is shared with the final release.
        if [[ "$PRERELEASE" == "true" ]]; then
          {
            echo "> [!IMPORTANT]"
            echo "> **${TAG} is a release candidate**, published as a pre-release."
            echo "> \`brew install xctesthtmlreport\` and"
            echo "> \`mint install XCTestHTMLReport/XCTestHTMLReport\` keep resolving to the"
            echo "> latest stable release, so this one is opt-in:"
            echo ">"
            echo "> \`\`\`bash"
            echo "> mint install XCTestHTMLReport/XCTestHTMLReport@${TAG}"
            echo "> \`\`\`"
            echo ">"
            echo "> Or download \`${ARCHIVE}\` below: a signed, notarized universal binary."
            echo
          } > release-body.md
        else
          : > release-body.md
        fi
        cat "$NOTES_FILE" >> release-body.md
        echo "have_notes=true" >> "$GITHUB_OUTPUT"

    # Signing and notarization say who built the binary and that Apple found
    # no malware in it. This says where: a signed statement, kept by GitHub,
    # that this exact archive came out of this workflow at this tag's commit.
    # Anyone can check a download against it:
    #
    #   gh attestation verify xchtmlreport-X.Y.Z.zip --repo XCTestHTMLReport/XCTestHTMLReport
    #
    # Here rather than in the sign job so that it attests the bytes about to
    # be published, after their trip through the artifact store, and before
    # the release exists -- a release is never public without one.
    - name: Attest the archive's provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: application/xchtmlreport-*.zip

    - name: Release
      # The GitHub CLI is preinstalled on the runner and does everything the
      # third-party release action was doing here, so the one job that handles
      # signed, notarized binaries and repository secrets no longer depends on
      # a third party. Reported as superfluous by zizmor.
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The checkout above is sparse and has no credentials, so gh cannot
        # work out which repository it is talking to from a git remote.
        GH_REPO: ${{ github.repository }}
        # Through the environment rather than interpolated into the script.
        TAG: ${{ github.ref_name }}
        PRERELEASE: ${{ needs.build.outputs.prerelease }}
        HAVE_NOTES: ${{ steps.notes.outputs.have_notes }}
      # --verify-tag because `gh release create` otherwise invents a tag from
      # the default branch when the one it is given does not exist. The tag is
      # what triggered this run, so that can only ever mean something is wrong.
      #
      # An unmatched glob fails the step, where the action would have published
      # a release with no binary attached to it.
      #
      # Re-running this over a tag that already has a published release fails,
      # rather than replacing its assets the way the action did. That is the
      # behaviour we want: these binaries are signed and notarized, and quietly
      # swapping the ones people have already downloaded is not something a
      # re-run button should be able to do. Failed runs need no cleanup — with
      # assets, gh creates the release as a draft, uploads, then publishes, and
      # deletes the draft if any of that fails.
      #
      # --generate-notes stays even when a hand-written document exists: gh
      # *prepends* --notes-file to the generated notes rather than replacing
      # them, so the release body reads as the curated document followed by
      # the automatic changelog and contributor list.
      #
      # --prerelease is what keeps a candidate off "Latest". GitHub never
      # promotes a pre-release, so no --latest=false is needed alongside it.
      run: |
        args=(--generate-notes --verify-tag)
        if [[ "$HAVE_NOTES" == "true" ]]; then
          args+=(--notes-file release-body.md)
        fi
        if [[ "$PRERELEASE" == "true" ]]; then
          args+=(--prerelease)
        fi
        gh release create "$TAG" "${args[@]}" application/xchtmlreport-*

  bump_version:
    runs-on: ubuntu-latest
    needs: [build, release]
    permissions:
      contents: write
      pull-requests: write
    # Never bump after a release candidate. Beyond making no sense on its own
    # terms, rc tags use the form X.Y.ZrcN, which is not valid semver (that
    # would be X.Y.Z-rcN). version-increment cannot parse it, silently falls
    # back to the last parseable tag, and proposes a version that goes
    # backwards — after 3.0.0rc1 it proposed 2.5.2.
    if: github.event_name == 'push' && needs.build.outputs.prerelease != 'true'
    steps:
      # Keeps its credentials on purpose: create-pull-request pushes the
      # version-bump branch from this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]

      # Bumps the patch component only. Major and minor bumps are deliberate
      # decisions and are made by hand before tagging.
      - name: Get next version
        uses: reecetech/version-increment@28d33de033e97a304f77238d6a5db26039ca15d6 # 2026.8.4
        id: version
        with:
          scheme: semver
          increment: patch

      - name: Write version file
        run: echo 'let version = "${{ steps.version.outputs.version }}"' > Sources/XCTestHTMLReport/Version.swift

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: "${{ steps.version.outputs.version }} Version Bump"
          body: "Bumping version from ${{ steps.version.outputs.current-version }} to ${{ steps.version.outputs.version }}"
          commit-message: "${{ steps.version.outputs.version }} version bump"
          branch: "version-bump/${{ steps.version.outputs.version }}"
          add-paths: Sources/XCTestHTMLReport/Version.swift
          reviewers: tylervick
          base: main

