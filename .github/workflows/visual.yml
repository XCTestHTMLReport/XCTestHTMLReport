name: Visual

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Only reads the tree.
permissions:
  contents: read

# A push to a pull request makes the run for the previous push worthless, so
# cancel it rather than let it hold a runner to the end. Only runs of the same
# pull request share a group. Everything else -- a push to `main`, a manual
# dispatch -- gets a group of its own, keyed on the run id, so it neither
# cancels nor waits behind anything. A shared group for `main` would not do,
# even with cancel-in-progress off: GitHub keeps one pending run per group and
# cancels the older one when a third arrives, so merges landing close together
# would lose a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # The dump needs Swift and therefore macOS. It does not need a simulator or
  # an .xcresult: the fixture is synthetic, so no cache restore and no
  # prepareTestResults.sh run appear anywhere in this workflow.
  dump:
    runs-on: macos-latest
    # One to two minutes in practice. The default is six hours.
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Xcode version
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    - name: Dump the synthetic render
      env:
        XCHR_VISUAL_DIR: ${{ runner.temp }}/fixtures
      run: swift test --filter VisualFixtureDumpTests

    - name: Upload fixtures
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: visual-fixtures
        path: ${{ runner.temp }}/fixtures
        retention-days: 7

  # Browsers install faster on Linux and the expensive runner is already done.
  visual:
    needs: dump
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: visual/package-lock.json

    - name: Download fixtures
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: visual-fixtures
        path: visual/fixtures

    # `npm ci` against the committed lockfile, so the browser layer cannot
    # drift under a rerun.
    - name: Install
      working-directory: visual
      run: |
        npm ci
        npx playwright install --with-deps chromium

    - name: Run browser assertions
      working-directory: visual
      run: npx playwright test

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-report
        path: visual/playwright-report
        retention-days: 14
