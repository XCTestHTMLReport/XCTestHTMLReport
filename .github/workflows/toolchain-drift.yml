name: Toolchain Drift

# Early warning for Apple toolchain changes (#392). The repo once went ~17
# months without anyone noticing whether it still worked on current Xcode;
# during the xcresulttool migration (#391) that blindness is acute, because
# Apple will remove the `--legacy` commands on their own schedule and the
# migration's differential test only works while both formats exist.
#
# Two legs run the same detection steps against two toolchains:
#
#   stable  — `macos-latest`, the Xcode the image calls stable. It fails the
#             run and files the `drift` issue.
#   preview — the `xcode-<N>` preview image and its default Xcode, with
#             matching simulator runtimes preinstalled. It answers "what does
#             the next Xcode break?" before that Xcode reaches `macos-latest`.
#             It never reddens the run.
#
# Which leg a toolchain runs on and how its findings are filed are separate
# questions, and the second is answered by the Xcode itself. The preview image
# starts each cycle holding a beta and goes on to hold the release: by November
# 2026 its default was Xcode 27.1 (27A9275), a release build users had had for
# weeks, while `macos-latest` was still Xcode 26. Every failure on it was still
# being filed under `drift-beta` as "advance notice, not a regression", on a
# green run (#478). So the `Record toolchain` step reads the running Xcode's
# license type and reports under one of two channels:
#
#   stable — a release build, on either leg. Files and comments on the `drift`
#            issue for that Xcode major, and saves the fixture cache.
#   beta   — a pre-release build, which only the preview leg can be running.
#            Advisory only: files under `drift-beta`, never touches a `drift`
#            issue, never writes the cache.
#
# Every signal here runs against the *current* toolchain, so nothing is
# cache-restored: fixtures are regenerated from scratch on purpose.
#
# Scheduled workflows only run from the default branch — this file takes
# effect once merged to main, and edits on feature branches are exercised
# only via workflow_dispatch after merge. Leg discovery below deliberately
# does not look at `github.event_name`, so a manual dispatch exercises the
# preview leg exactly as a scheduled run does; keep it that way.
on:
  schedule:
    # Twice a week, off the top of the hour (GitHub sheds load at :00).
    # Modest by design: each run boots a simulator and regenerates all
    # fixtures, which dominates macOS runner minutes.
    - cron: '23 7 * * 1,4'
  workflow_dispatch:

# `issues: write` is what lets a failed run file the drift issue below — the
# loud signal that does not depend on anyone reading the Actions tab. It is
# granted per job rather than here, because the discovery job below only reads
# a public API and has no business holding a token that can file issues.
permissions:
  contents: read

jobs:
  # Decides which legs run, on a free ubuntu runner in ~10s. It exists so a
  # retired preview label can never park a macOS job in the queue: `runs-on`
  # with an unknown GitHub-hosted label does not fail fast, it waits for a
  # self-hosted runner that will never arrive, and a job that sits queued holds
  # its concurrency group. Deciding the label against a live source before any
  # macOS job is requested is the first of the two defences; the per-leg
  # concurrency group on `drift` below is the second, for the cases discovery
  # cannot see (a stale `XCODE_BETA_RUNNER` pin, or an image retired in the
  # window between discovery and scheduling).
  discover:
    runs-on: ubuntu-latest
    # Preview-leg machinery must never redden the run. The drift job already
    # survives a failed discover (!cancelled() + the hard-coded fallback
    # matrix); this closes the one remaining path where preview-only plumbing
    # could fail the workflow.
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.legs.outputs.matrix }}
    steps:
    # Only for the local action below, which test.yml shares.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Kill switch and manual pin, both without editing this file: set the
    # XCODE_BETA_RUNNER repository variable to `off` to drop the preview leg,
    # or to a runner label (`xcode-28`) to force one before discovery learns of
    # it. Every failure in the action leaves the label empty and simply drops
    # the preview leg. That is the only acceptable direction: this job must
    # never take the stable signal down with it.
    #
    # `require: any` — the newest preview image whatever it holds, because a
    # beta is what this leg is for. test.yml asks the same action for the
    # newest image with a *release* default instead, and has its own variable
    # (XCODE_PR_PREVIEW_RUNNER), so neither switch touches the other workflow.
    - name: Discover the Xcode preview runner
      id: preview
      uses: ./.github/actions/discover-preview-runner # zizmor: ignore[self-repository] -- actionlint rejects $/ until rhysd/actionlint#711
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        require: any
        override: ${{ vars.XCODE_BETA_RUNNER }}

    - name: Decide which toolchain legs run
      id: legs
      env:
        LABEL: ${{ steps.preview.outputs.label }}
        SKIP_REASON: ${{ steps.preview.outputs.skip-reason }}
      run: |
        stable='{"leg":"stable","runner":"macos-latest","experimental":false}'

        preview=''
        if [ -n "$LABEL" ]; then
          preview=",{\"leg\":\"preview\",\"runner\":\"${LABEL}\",\"experimental\":true}"
          echo "Preview leg: \`${LABEL}\`." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Preview leg skipped — ${SKIP_REASON}." >> "$GITHUB_STEP_SUMMARY"
        fi

        echo "matrix={\"include\":[${stable}${preview}]}" >> "$GITHUB_OUTPUT"

  drift:
    needs: discover
    # The preview leg must never cost the stable signal anything, and the new
    # dependency above is itself a way it could: a failed `discover` would
    # otherwise skip this job entirely and the run would detect nothing. So
    # run regardless of how discovery went, falling back to a stable-only
    # matrix when it produced no usable output. (Duplicated leg definition on
    # purpose — a fallback that referenced discovery's output would inherit
    # exactly the failure it is there to survive.)
    if: ${{ !cancelled() }}
    name: drift (${{ matrix.leg }})
    runs-on: ${{ matrix.runner }}
    # A backstop for the steps that carry no timeout of their own. It has to
    # stay above the sum of the ones that do (30 + 90 + 45 + 15 + 15): the report
    # step at the end is what files the issue, and a job-level timeout that
    # fired first would turn a hung simulator into a silent cancellation. The
    # beta leg takes up to fifty minutes when nothing hangs.
    timeout-minutes: 210
    permissions:
      contents: read
      issues: write
    # A preview-leg failure annotates the run; it does not redden it, whichever
    # channel it reports under. This is decided here, per leg, before the job
    # knows what Xcode the image holds — so a release build on the preview
    # image files a `drift` issue and fails its own job, but the run stays
    # green. The stable leg keeps its `exit 1` → red run behaviour untouched.
    continue-on-error: ${{ matrix.experimental }}
    # Serialised per leg rather than per workflow. Two drift runs must not
    # overlap — each boots a simulator, regenerates every fixture and writes the
    # cache — but a group shared with the preview leg would hand it the one
    # lever it must never have over the stable signal. A job requesting a label
    # GitHub does not serve sits queued instead of failing, and while it sits
    # it holds its group; scoping the group to `matrix.leg` keeps that blast
    # radius inside the preview leg no matter how the label went stale.
    concurrency:
      group: toolchain-drift-${{ matrix.leg }}
    strategy:
      # Without this a failing preview leg would cancel the stable one mid-run.
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix || '{"include":[{"leg":"stable","runner":"macos-latest","experimental":false}]}') }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Stable leg only. The preview image's default Xcode is already
    # `/Applications/Xcode.app` and already the active developer dir. While the
    # image holds only a beta, `latest-stable` has nothing there to resolve to
    # and this step would fail the leg before it measured anything; once it
    # holds releases as well (27.0, 27.1 and 27.2 side by side, by November
    # 2026) it would resolve to the newest point release rather than the one
    # the image selects. Using the image default is the contract that survives
    # both: across beta seeds the real bundle is `Xcode_27_beta_<N>.app` and
    # the `_beta_N` moves, while `/Applications/Xcode.app` always points at
    # whatever the image means people to use.
    - name: Setup Xcode version
      if: matrix.leg == 'stable'
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    # Tolerates a failing `xcresulttool version` on purpose: a missing tool is
    # a signal for the legacy probe below, not a setup error. The `|| true`
    # lives inside the pipeline so the tolerance holds even under pipefail —
    # without it this step only survives because the default shell
    # (`bash -e {0}`) leaves pipefail off, and adding `shell: bash` (which
    # GitHub runs with `-o pipefail`) would silently re-break it.
    #
    # The channel is decided first and written out before anything that can
    # fail, so a toolchain broken enough to stop this step still reports under
    # the right label.
    #
    # `licenseType` in the Xcode bundle's own LicenseInfo.plist is `GM` for a
    # release and `Beta` for a pre-release seed. It is read rather than
    # inferred from the build number, because a trailing letter there does not
    # mean beta: the preview image lists the released Xcode 27.0 as build
    # 27A266a. Anything other than a readable `GM` on the preview leg stays
    # `beta`. That is the safe direction for a guess — a mislabelled release
    # is filed as advance notice, as all of them were before, while a
    # mislabelled beta would put pre-release noise on the `drift` issue.
    #
    # The stable leg is `stable` without being asked: `latest-stable` never
    # resolves to a pre-release, and the one alarm this workflow exists to
    # protect should not hang on a plist read.
    - name: Record toolchain
      id: toolchain
      env:
        LEG: ${{ matrix.leg }}
      run: |
        channel=stable
        if [ "$LEG" != 'stable' ]; then
          license_type="$(/usr/libexec/PlistBuddy -c 'Print :licenseType' \
            "$(xcode-select -p)/../Resources/LicenseInfo.plist" 2>/dev/null || true)"
          echo "Xcode license type: ${license_type:-unreadable}"
          if [ "$license_type" != 'GM' ]; then
            channel=beta
          fi
        fi
        echo "Reporting channel: ${channel}"
        echo "channel=${channel}" >> "$GITHUB_OUTPUT"

        xcodebuild -version
        swift --version
        xcresulttool_line="$({ xcrun xcresulttool version 2>&1 || true; } | head -n 1)"
        echo "${xcresulttool_line:-xcresulttool version unavailable}"
        xcode="$(xcodebuild -version | awk 'NR==1 {v=$2} NR==2 {b=$3} END {printf "%s (%s)", v, b}')"
        echo "xcode=${xcode}" >> "$GITHUB_OUTPUT"
        echo "xcresulttool=${xcresulttool_line:-unavailable}" >> "$GITHUB_OUTPUT"

    # `xcrun xcresulttool version` currently prints
    #   "... (legacy commands format version: 3.56)"
    # That parenthetical is Apple's own marker for the legacy command surface
    # that `xcrun xcresulttool get --legacy` depends on. It is expected to
    # disappear when Apple removes legacy support — the exact event the
    # migration (#391) is racing. When this step fails, treat it as the alarm.
    # On the preview leg it is the single most valuable signal in this
    # workflow: Apple's Xcode 27 release notes say nothing about `xcresulttool`
    # either way, so running the probe there is the only way to learn the
    # answer before that Xcode lands on `macos-latest`.
    # `!cancelled()`: this probe needs only `xcrun`, and a toolchain broken
    # enough to hard-fail the record step above (`xcodebuild`/`swift` exiting
    # non-zero) is exactly when the legacy alarm matters most — it must still
    # run and reach the report step instead of being skipped with the rest.
    - name: Check legacy xcresulttool support
      id: legacy
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: |
        # `|| true` so that xcresulttool disappearing entirely still reaches
        # the grep and fires the explicit alarm below rather than a bare error.
        version_output="$(xcrun xcresulttool version 2>&1 || true)"
        echo "$version_output"
        if ! grep -q "legacy commands format version" <<<"$version_output"; then
          echo "::error::xcresulttool no longer advertises legacy command support — Apple has likely removed the --legacy commands (#391)"
          exit 1
        fi

    # The independent signals below all run continue-on-error so one failure
    # cannot hide another; the report step turns their outcomes into faults.
    - name: Build
      id: build
      continue-on-error: true
      timeout-minutes: 30
      run: swift build -v

    # Computed BEFORE generation, not at save time: `hashFiles` inside the
    # shared action renders when this step executes, while the tree still
    # matches what test.yml hashes on a clean checkout. Rendering it in the
    # save step's key would hash the .derivedData that generation leaves in
    # the sample-app dir, producing a key no test.yml run could ever restore.
    # continue-on-error: the pre-warm is a side effect — its failure must not
    # gate any detection signal below.
    #
    # Runs on the preview leg too, even when that leg will not save: the action
    # shells out to `xcodebuild -version` and scripts/select_simulator.py, and
    # either breaking on a new toolchain or a brand-new simulator runtime is
    # itself drift worth seeing early.
    - name: Compute fixture cache key
      id: fixture-key
      continue-on-error: true
      uses: ./.github/actions/fixture-cache-key # zizmor: ignore[self-repository] -- actionlint rejects $/ until rhysd/actionlint#711

    # Deliberately no cache restore: this job exists to prove the current
    # toolchain can still produce fixtures at all. Fixture generation does not
    # depend on the package build (it builds the sample app with xcodebuild),
    # so it runs even when the build step failed.
    - name: Generate fresh fixtures
      id: fixtures
      continue-on-error: true
      timeout-minutes: 90
      run: ./prepareTestResults.sh

    # A separate step from generation on purpose. `prepareTestResults.sh`
    # tolerates failing tests (`|| true`), which also swallows a simulator
    # disappearing mid-run: xcodebuild still leaves a stub .xcresult behind and
    # the script exits 0. Verifying separately keeps "generation blew up" and
    # "generation produced empty bundles" as distinguishable faults in the
    # report below, and everything downstream — the suite, the render, and the
    # cache save — now hangs off this step rather than off generation, so a
    # stub can neither produce confusing downstream failures nor be saved under
    # a key test.yml would restore (#454).
    - name: Verify fresh fixtures
      id: verify
      if: steps.fixtures.outcome == 'success'
      continue-on-error: true
      run: ./scripts/verify_fixtures.sh

    - name: Run test suite
      id: tests
      if: steps.verify.outcome == 'success'
      continue-on-error: true
      timeout-minutes: 45
      run: swift test -v

    # The issue's core signal: since 3.0 the tool exits 3 when the report is
    # degraded (collected faults); any other non-zero exit is a hard error,
    # not degradation. A clean exit against a bundle produced by this exact
    # toolchain is the whole assertion. The exit code is captured as a step
    # output so the drift report can tell those two failures apart.
    #
    # No `mkdir -p` here: #445 added one to stop a missing --output directory
    # from being misreported as toolchain drift, and #446 fixed the tool to
    # create the directory itself. Pointing at an uncreated path is now part
    # of what this step asserts — restoring the mkdir would hide a regression.
    - name: Run xchtmlreport against a fresh bundle
      id: tool
      if: steps.build.outcome == 'success' && steps.verify.outcome == 'success'
      continue-on-error: true
      timeout-minutes: 15
      run: |
        exit_code=0
        swift run xchtmlreport \
          Tests/XCTestHTMLReportTests/Resources/TestResults.xcresult \
          --output "$RUNNER_TEMP/drift-report" || exit_code=$?
        echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
        if [ "$exit_code" -ne 0 ]; then
          echo "::error::xchtmlreport exited with code ${exit_code}"
          exit "$exit_code"
        fi

    # This job regenerated fixtures for the newest toolchain anyway, so save
    # them under the same key test.yml computes (#436): after a toolchain bump
    # on the runners, PR jobs start from a warm cache instead of each paying
    # for regeneration. Saving is a side effect, never an input — nothing in
    # this workflow restores from the cache. The key was computed by the
    # shared action before generation, so it matches test.yml's clean-tree
    # restore key exactly.
    #
    # Gated on the verify step, not on generation: this is the one place a stub
    # bundle would do lasting damage, poisoning every PR run that hits the key
    # until it rotates (#454). Verify only runs when generation succeeded, so
    # its success implies both.
    #
    # Stable channel only — which is both legs once the preview image holds a
    # release, because test.yml runs its suite on that image too and looks up
    # exactly this key. Poisoning across legs is impossible either way: the key
    # embeds the Xcode build, so the two legs can never write the same entry,
    # and test.yml has no restore-keys for a prefix match to sneak through. A
    # beta's entry is skipped because it is dead weight: the next seed changes
    # the build and with it the key, so nothing would restore it for long, and
    # it counts against the repo's 10 GB cache budget, where its only lasting
    # effect is pushing the *useful* entries closer to LRU eviction.
    - name: Save fixtures to cache
      if: steps.toolchain.outputs.channel == 'stable' && steps.fixture-key.outcome == 'success' && steps.verify.outcome == 'success'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          Tests/XCTestHTMLReportTests/Resources/TestResults.xcresult
          Tests/XCTestHTMLReportTests/Resources/SanityResults.xcresult
          Tests/XCTestHTMLReportTests/Resources/RetryResults.xcresult
          Tests/XCTestHTMLReportTests/Resources/CrashResults.xcresult
        key: ${{ steps.fixture-key.outputs.key }}

    # The bundles themselves, whenever this leg found anything wrong.
    #
    # #478 is the argument for this step. A beta run produced a `TestResults`
    # bundle missing 12 of its 21 tests; `toolchain-drift.yml` uploaded nothing,
    # so triaging it meant reading two job logs and inferring the bundle's shape
    # from which assertions failed — and the one question that mattered most
    # (whether XCTest stopped recording `file:line` in failure titles, or
    # xcresulttool stopped emitting it) could not be answered at all without a
    # bundle to interrogate. `gh run download` on that run reported "no valid
    # artifacts found". Fifty megabytes is a cheap price for the next triage
    # starting from evidence.
    #
    # Named per leg, the convention #470 established for `test.yml`:
    # upload-artifact v4+ rejects duplicate names, so a run where both legs
    # failed would otherwise lose the second upload. Five days rather than the
    # 7-14 elsewhere, because these are ~50 MB each and this workflow runs twice
    # a week — a triage that has not started by the next scheduled run will be
    # working from that run's bundles instead.
    #
    # Placed before the report step, not after: `Report drift` exits 1 on the
    # stable leg, and a step after a failed step does not run unless it says so.
    #
    # The condition enumerates the signals rather than saying `failure()`,
    # because a bare `failure()` would never fire here — every signal above is
    # continue-on-error, so a failing one leaves the job itself successful.
    # `!cancelled()` is what still covers the case where a step that is *not*
    # continue-on-error (the cache save) failed first. Generation failing
    # outright can leave no bundle at all, so the upload tolerates finding
    # nothing rather than adding a red step of its own.
    #
    # Same six steps `Report drift` reads, but only their `failure` outcome —
    # a narrower set than the one that files an issue, which also treats a
    # `skipped` legacy probe or fixture step as a fault worth reporting. That
    # difference is deliberate: those outcomes mean the step never ran, so
    # there is no bundle behind them to attach. Widening this to match would
    # only ever upload a stale or empty directory.
    #
    # Bounded, and allowed to fail, for the sake of the step after it: the
    # bundles are evidence, the issue is the alarm. An upload that stalled
    # would otherwise run into the job-level timeout, which cancels the job
    # and takes `Report drift` with it.
    - name: Upload fixtures on drift
      continue-on-error: true
      timeout-minutes: 15
      if: >-
        ${{ !cancelled() && (steps.legacy.outcome == 'failure'
        || steps.build.outcome == 'failure'
        || steps.fixtures.outcome == 'failure'
        || steps.verify.outcome == 'failure'
        || steps.tests.outcome == 'failure'
        || steps.tool.outcome == 'failure') }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: xcresult-fixtures-${{ matrix.leg }}
        path: Tests/XCTestHTMLReportTests/Resources
        retention-days: 5
        if-no-files-found: ignore

    # Turns step outcomes into a filed issue, so a broken scheduled run cannot
    # rot unseen in the Actions tab. One open issue per toolchain collects
    # repeat failures as comments; a later green run comments on it too, so the
    # maintainer can tell a persistent break from a resolved one.
    #
    # One step serves both legs and both channels, parameterised by the channel
    # `Record toolchain` decided. A second copy for betas is exactly how the two
    # would drift apart, and the dedup and green-comment behaviour is the part
    # that must not (#454). What the channel changes: which label is searched
    # and filed under, the issue title, the banner that opens a beta body, and
    # whether the step exits non-zero at the end.
    #
    # The channel falls back to the leg's own default if `Record toolchain`
    # never wrote one, which takes the runner failing before the step started:
    # `stable` on the stable leg, and `beta` on the preview leg for the reason
    # given there.
    #
    # `!cancelled()` rather than `always()`: a manually cancelled run is not
    # drift and must not file anything.
    - name: Report drift
      if: ${{ !cancelled() }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        CHANNEL: ${{ steps.toolchain.outputs.channel || (matrix.leg == 'stable' && 'stable' || 'beta') }}
        LEG: ${{ matrix.leg }}
        RUNNER_LABEL: ${{ matrix.runner }}
        XCODE: ${{ steps.toolchain.outputs.xcode }}
        XCRESULTTOOL: ${{ steps.toolchain.outputs.xcresulttool }}
        LEGACY: ${{ steps.legacy.outcome }}
        BUILD: ${{ steps.build.outcome }}
        FIXTURES: ${{ steps.fixtures.outcome }}
        VERIFY: ${{ steps.verify.outcome }}
        TESTS: ${{ steps.tests.outcome }}
        TOOL: ${{ steps.tool.outcome }}
        TOOL_EXIT: ${{ steps.tool.outputs.exit_code }}
      run: |
        if [ "$CHANNEL" = "beta" ]; then
          ISSUE_LABEL=drift-beta
        else
          ISSUE_LABEL=drift
        fi

        faults=()
        if [ "$LEGACY" = "failure" ]; then
          faults+=("**Legacy \`xcresulttool\` marker vanished.** \`xcrun xcresulttool version\` no longer reports a \`legacy commands format version\`, meaning Apple has likely removed the \`--legacy\` command surface. The #391 migration loses its differential baseline the moment this toolchain reaches users — treat as urgent.")
        elif [ "$LEGACY" != "success" ]; then
          # The probe runs under `!cancelled()`, so this should be impossible;
          # if it happens anyway, say so rather than reporting only a generic
          # setup fault while the one alarm that matters went unevaluated.
          faults+=("Legacy \`xcresulttool\` probe did not run (outcome: ${LEGACY:-unknown}) — the legacy alarm was NOT evaluated this run; see the run log.")
        fi
        if [ "$BUILD" = "failure" ]; then
          faults+=("\`swift build\` failed on this toolchain.")
        fi
        if [ "$FIXTURES" = "failure" ]; then
          faults+=("Fixture generation (\`prepareTestResults.sh\`) failed on this toolchain.")
        elif [ "$FIXTURES" = "skipped" ]; then
          faults+=("Run aborted before fixture generation — a setup step failed; see the run log.")
        fi
        if [ "$VERIFY" = "failure" ]; then
          faults+=("Fixture generation reported success but produced a bundle with no test data — the run log names it. Usually the runner's simulator went away mid-run and \`xcodebuild\` left a stub \`.xcresult\` behind (#454). Nothing was saved to the fixture cache, and the signals below were skipped because they would only have failed confusingly against the stub.")
        fi
        if [ "$TESTS" = "failure" ]; then
          faults+=("\`swift test\` failed against freshly generated fixtures.")
        fi
        if [ "$TOOL" = "failure" ]; then
          if [ "$TOOL_EXIT" = "3" ]; then
            faults+=("\`xchtmlreport\` exited 3 against a fresh \`.xcresult\` — since 3.0 that means the report degraded (collected faults).")
          else
            faults+=("\`xchtmlreport\` failed against a fresh \`.xcresult\` with a hard error (exit ${TOOL_EXIT:-unknown}) — not fault degradation; see the run log.")
          fi
        fi

        {
          echo "### Toolchain"
          echo "- Channel: ${CHANNEL} (\`runs-on: ${RUNNER_LABEL}\`)"
          echo "- Xcode: ${XCODE}"
          echo "- xcresulttool: \`${XCRESULTTOOL}\`"
          echo
          echo "### Step outcomes"
          echo "| Step | Outcome |"
          echo "| --- | --- |"
          echo "| legacy xcresulttool marker | ${LEGACY} |"
          echo "| swift build | ${BUILD} |"
          echo "| fixture generation | ${FIXTURES} |"
          echo "| fixtures contain test data | ${VERIFY} |"
          echo "| swift test | ${TESTS} |"
          echo "| xchtmlreport clean exit | ${TOOL} |"
        } > "$RUNNER_TEMP/summary.md"
        cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

        # Scoped to this channel's label, so a beta can never comment on,
        # reopen or resolve a `drift` issue — the alarm whose trustworthiness
        # the whole design is protecting. Nothing here ever applies both
        # labels, but a human might, so a beta also skips anything carrying
        # `drift` rather than trusting that it never happens. Deliberately
        # one-directional: promoting a beta finding to a real regression by
        # adding `drift` to it should let a *stable* report adopt that issue,
        # not make it file a duplicate.
        #
        # The stable channel has one more thing to keep apart. Two legs can
        # report under it at once — `macos-latest` on one Xcode major and the
        # preview image on the next — and they are different toolchains: a
        # green run on Xcode 26 says nothing about an issue filed for Xcode 27,
        # and must not comment "this may be resolved" on it. So a stable report
        # takes the open `drift` issue whose title names its own Xcode major,
        # which every title this step writes does (as does a promoted beta
        # issue's). Failing that it adopts one that names no Xcode at all — an
        # issue a person filed or retitled — and it never touches one that
        # names a different major: it files its own instead.
        xcode_major="${XCODE%%.*}"
        if [ "$CHANNEL" = "beta" ]; then
          select_issue='map(select([.labels[].name] | index("drift") | not)) | .[0].number // empty'
        else
          case "$xcode_major" in
          ''|*[!0-9]*)
            # No usable version — `xcodebuild -version` itself failed. Fall
            # back to "any open issue" rather than filing one per run.
            select_issue='.[0].number // empty'
            ;;
          *)
            select_issue="(map(select(.title | test(\"Xcode ${xcode_major}[.]\"))) | .[0].number)"
            select_issue="${select_issue} // (map(select(.title | test(\"Xcode [0-9]+[.]\") | not)) | .[0].number)"
            select_issue="${select_issue} // empty"
            ;;
          esac
        fi
        open_issue="$(gh issue list --repo "$REPO" --label "$ISSUE_LABEL" --state open \
          --json number,title,labels --jq "$select_issue")"

        if [ "${#faults[@]}" -eq 0 ]; then
          echo "No drift detected."
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --repo "$REPO" \
              --body "Latest scheduled ${CHANNEL} drift run passed on Xcode ${XCODE} — this may be resolved. (${RUN_URL})"
          fi
          exit 0
        fi

        if [ "$CHANNEL" = "beta" ]; then
          issue_title="Beta toolchain drift detected (Xcode ${XCODE})"
          label_color=FBCA04
          label_description="Xcode beta drift detected by scheduled CI — advance notice, not a regression"
        else
          issue_title="Toolchain drift detected (Xcode ${XCODE})"
          label_color=D93F0B
          label_description="Toolchain drift detected by scheduled CI"
        fi

        {
          if [ "$CHANNEL" = "beta" ]; then
            echo "> [!WARNING]"
            echo "> **This is a beta toolchain report — advance notice, not a regression.**"
            echo "> It comes from the \`${RUNNER_LABEL}\` preview runner image, whose default Xcode is"
            echo "> currently a pre-release (${XCODE}). Nothing here blocks a merge, reddens a run, or means the"
            echo "> shipping toolchain is broken — that is tracked separately under the \`drift\` label."
            echo "> Beta failures are expected to be noisy, especially in the weeks after WWDC. Read this"
            echo "> as roughly two months of warning about what Xcode GA will bring to \`macos-latest\`."
            echo
            echo "A [beta toolchain drift run](${RUN_URL}) failed against a pre-release Xcode. Each item below is an independent failure signal."
          elif [ "$LEG" = "stable" ]; then
            echo "A scheduled [toolchain drift run](${RUN_URL}) failed against the newest Xcode available on the runners. Each item below is an independent failure signal."
          else
            echo "A scheduled [toolchain drift run](${RUN_URL}) failed against Xcode ${XCODE}, a release build, on the \`${RUNNER_LABEL}\` preview runner image. \`macos-latest\` does not carry this Xcode yet, but people have it installed: this is a regression on a shipping toolchain, not advance notice. Each item below is an independent failure signal."
          fi
          echo
          for fault in "${faults[@]}"; do
            echo "- ${fault}"
          done
          echo
          cat "$RUNNER_TEMP/summary.md"
          echo
          # The pointer matters as much as the upload: #478 was triaged from
          # logs because nobody knew there was nothing to download.
          echo "The \`.xcresult\` bundles this leg generated are attached to the run as"
          echo "\`xcresult-fixtures-${LEG}\` (5-day retention) — interrogate those rather than"
          echo "these logs. Nothing is attached if generation failed before writing a bundle."
          echo
          echo "_Filed automatically by the \`toolchain-drift\` workflow (#392). While this issue stays open, later failing runs append comments here instead of filing duplicates._"
        } > "$RUNNER_TEMP/issue.md"

        if [ -n "$open_issue" ]; then
          gh issue comment "$open_issue" --repo "$REPO" --body-file "$RUNNER_TEMP/issue.md"
        else
          gh label create "$ISSUE_LABEL" --repo "$REPO" --force \
            --description "$label_description" --color "$label_color"
          gh issue create --repo "$REPO" --label "$ISSUE_LABEL" \
            --title "$issue_title" \
            --body-file "$RUNNER_TEMP/issue.md"
        fi

        # The issue is the durable signal; on the stable leg the red run is the
        # ambient one. A release build on the preview leg fails this step too:
        # the job is continue-on-error, so the run stays green, but its job is
        # marked failed in the run's own list rather than passing with an open
        # regression. A beta exits 0 instead, because failing there would add
        # nothing but a red step inside a run that is green by design.
        if [ "$CHANNEL" = "stable" ]; then
          exit 1
        fi
