name: Toolchain Drift

# Early warning for Apple toolchain changes (#392). The repo once went ~17
# months without anyone noticing whether it still worked on current Xcode;
# during the xcresulttool migration (#391) that blindness is acute, because
# Apple will remove the `--legacy` commands on their own schedule and the
# migration's differential test only works while both formats exist.
#
# Two legs run the same detection steps against two toolchains:
#
#   stable — `macos-latest`, the Xcode users actually have. This is the leg
#            that matters: it fails the run and files the `drift` issue.
#   beta   — the `xcode-<N>` preview image, whose default Xcode is the current
#            beta with matching simulator runtimes preinstalled. It answers
#            "what does the next Xcode break?" roughly two months before GA
#            reaches `macos-latest`. It is advisory only: it never reddens the
#            run, never touches the `drift` issue, and never writes the cache.
#
# Every signal here runs against the *current* toolchain, so nothing is
# cache-restored: fixtures are regenerated from scratch on purpose.
#
# Scheduled workflows only run from the default branch — this file takes
# effect once merged to main, and edits on feature branches are exercised
# only via workflow_dispatch after merge. Leg discovery below deliberately
# does not look at `github.event_name`, so a manual dispatch exercises the
# beta leg exactly as a scheduled run does; keep it that way.
on:
  schedule:
    # Twice a week, off the top of the hour (GitHub sheds load at :00).
    # Modest by design: each run boots a simulator and regenerates all
    # fixtures, which dominates macOS runner minutes.
    - cron: '23 7 * * 1,4'
  workflow_dispatch:

# `issues: write` is what lets a failed run file the drift issue below — the
# loud signal that does not depend on anyone reading the Actions tab. It is
# granted per job rather than here, because the discovery job below only reads
# a public API and has no business holding a token that can file issues.
permissions:
  contents: read

concurrency:
  group: toolchain-drift

jobs:
  # Decides which legs run, on a free ubuntu runner in ~10s. It exists so a
  # retired preview label can never park a macOS job in the queue: `runs-on`
  # with an unknown GitHub-hosted label does not fail fast, it waits for a
  # self-hosted runner that will never arrive — and because `concurrency` above
  # is workflow-level, that queued job would hold the group and delay the next
  # *stable* run. Deciding the label before any macOS job is requested makes
  # that failure mode unreachable.
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.legs.outputs.matrix }}
    steps:
    - name: Decide which toolchain legs run
      id: legs
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Kill switch and manual pin, both without editing this file: set the
        # repository variable to `off` to drop the beta leg, or to a runner
        # label (`xcode-28`) to force one before discovery below learns of it.
        # Passed through `env` rather than interpolated into the script, so a
        # variable value can never become shell syntax.
        OVERRIDE: ${{ vars.XCODE_BETA_RUNNER }}
      run: |
        stable='{"channel":"stable","runner":"macos-latest","issue_label":"drift","experimental":false}'
        label=''
        skip_reason='no Xcode beta runner image is currently published'

        if [ "$OVERRIDE" = 'off' ]; then
          skip_reason='disabled by the XCODE_BETA_RUNNER repository variable'
        elif [ -n "$OVERRIDE" ]; then
          echo "Beta runner label pinned to '${OVERRIDE}' by the XCODE_BETA_RUNNER repository variable."
          label="$OVERRIDE"
        else
          # actions/runner-images ships a manifest per image it currently
          # serves, and deletes that manifest in the same commit that
          # deprecates the image (macos-13's went in "deprecate macOS 13
          # code"). So "a manifest named xcode-<N> exists" is a live check on
          # whether the preview label is still served. Release tags are not:
          # `xcode-27/...` tags stay in the list long after the label is gone.
          #
          # Every failure here — API outage, rate limit, no such manifest —
          # leaves the label empty and simply drops the beta leg. That is the
          # only acceptable direction: this job must never take the stable
          # signal down with it.
          major="$(gh api repos/actions/runner-images/contents/images/macos \
            --jq '[.[].name | capture("^xcode-(?<m>[0-9]+)(-arm64)?-Readme[.]md$").m | tonumber] | max // empty' \
            2>/dev/null || true)"
          if [ -n "$major" ]; then
            label="xcode-${major}"
          fi
        fi

        # The label reaches both `runs-on` and a JSON string below, so reject
        # anything that is not shaped like a runner label rather than trusting
        # the variable or the API response to be well behaved.
        case "$label" in
        '') ;;
        *[!a-zA-Z0-9._-]*)
          echo "::warning::Ignoring '${label}': not a plain runner label. Beta leg skipped."
          skip_reason="'${label}' is not a plain runner label"
          label=''
          ;;
        esac

        beta=''
        if [ -n "$label" ]; then
          beta=",{\"channel\":\"beta\",\"runner\":\"${label}\",\"issue_label\":\"drift-beta\",\"experimental\":true}"
          echo "Beta leg: \`${label}\`." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Beta leg skipped — ${skip_reason}." >> "$GITHUB_STEP_SUMMARY"
        fi

        echo "matrix={\"include\":[${stable}${beta}]}" >> "$GITHUB_OUTPUT"

  drift:
    needs: discover
    # The beta leg must never cost the stable signal anything, and the new
    # dependency above is itself a way it could: a failed `discover` would
    # otherwise skip this job entirely and the run would detect nothing. So
    # run regardless of how discovery went, falling back to a stable-only
    # matrix when it produced no usable output. (Duplicated leg definition on
    # purpose — a fallback that referenced discovery's output would inherit
    # exactly the failure it is there to survive.)
    if: ${{ !cancelled() }}
    name: drift (${{ matrix.channel }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      issues: write
    # A beta failure annotates the run; it does not redden it. The stable leg
    # keeps its `exit 1` → red run behaviour untouched.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      # Without this a failing beta leg would cancel the stable one mid-run.
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix || '{"include":[{"channel":"stable","runner":"macos-latest","issue_label":"drift","experimental":false}]}') }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Stable leg only. The beta image ships exactly one Xcode — the beta — and
    # it is already `/Applications/Xcode.app` and already the active developer
    # dir, so `latest-stable` has nothing there to resolve to and this step
    # would fail the leg before it measured anything. Using the image default
    # is also the contract that survives each beta seed: the real bundle is
    # `Xcode_27_beta_<N>.app` and the `_beta_N` moves, while the
    # `Xcode_<major>.<minor>.app` symlinks are maintained across seeds.
    - name: Setup Xcode version
      if: matrix.channel == 'stable'
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    # Tolerates a failing `xcresulttool version` on purpose: a missing tool is
    # a signal for the legacy probe below, not a setup error. The `|| true`
    # lives inside the pipeline so the tolerance holds even under pipefail —
    # without it this step only survives because the default shell
    # (`bash -e {0}`) leaves pipefail off, and adding `shell: bash` (which
    # GitHub runs with `-o pipefail`) would silently re-break it.
    - name: Record toolchain
      id: toolchain
      run: |
        xcodebuild -version
        swift --version
        xcresulttool_line="$({ xcrun xcresulttool version 2>&1 || true; } | head -n 1)"
        echo "${xcresulttool_line:-xcresulttool version unavailable}"
        xcode="$(xcodebuild -version | awk 'NR==1 {v=$2} NR==2 {b=$3} END {printf "%s (%s)", v, b}')"
        echo "xcode=${xcode}" >> "$GITHUB_OUTPUT"
        echo "xcresulttool=${xcresulttool_line:-unavailable}" >> "$GITHUB_OUTPUT"

    # `xcrun xcresulttool version` currently prints
    #   "... (legacy commands format version: 3.56)"
    # That parenthetical is Apple's own marker for the legacy command surface
    # that `xcrun xcresulttool get --legacy` depends on. It is expected to
    # disappear when Apple removes legacy support — the exact event the
    # migration (#391) is racing. When this step fails, treat it as the alarm.
    # On the beta leg it is the single most valuable signal in this workflow:
    # Apple's Xcode 27 release notes say nothing about `xcresulttool` either
    # way, so running the probe on the beta is the only way to learn the answer
    # before GA lands on `macos-latest`.
    # `!cancelled()`: this probe needs only `xcrun`, and a toolchain broken
    # enough to hard-fail the record step above (`xcodebuild`/`swift` exiting
    # non-zero) is exactly when the legacy alarm matters most — it must still
    # run and reach the report step instead of being skipped with the rest.
    - name: Check legacy xcresulttool support
      id: legacy
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: |
        # `|| true` so that xcresulttool disappearing entirely still reaches
        # the grep and fires the explicit alarm below rather than a bare error.
        version_output="$(xcrun xcresulttool version 2>&1 || true)"
        echo "$version_output"
        if ! grep -q "legacy commands format version" <<<"$version_output"; then
          echo "::error::xcresulttool no longer advertises legacy command support — Apple has likely removed the --legacy commands (#391)"
          exit 1
        fi

    # The independent signals below all run continue-on-error so one failure
    # cannot hide another; the report step turns their outcomes into faults.
    - name: Build
      id: build
      continue-on-error: true
      timeout-minutes: 30
      run: swift build -v

    # Computed BEFORE generation, not at save time: `hashFiles` inside the
    # shared action renders when this step executes, while the tree still
    # matches what test.yml hashes on a clean checkout. Rendering it in the
    # save step's key would hash the .derivedData that generation leaves in
    # the sample-app dir, producing a key no test.yml run could ever restore.
    # continue-on-error: the pre-warm is a side effect — its failure must not
    # gate any detection signal below.
    #
    # Runs on the beta leg too, even though that leg never saves: the action
    # shells out to `xcodebuild -version` and scripts/select_simulator.py, and
    # either breaking on a new toolchain or a brand-new simulator runtime is
    # itself drift worth seeing early.
    - name: Compute fixture cache key
      id: fixture-key
      continue-on-error: true
      uses: ./.github/actions/fixture-cache-key

    # Deliberately no cache restore: this job exists to prove the current
    # toolchain can still produce fixtures at all. Fixture generation does not
    # depend on the package build (it builds the sample app with xcodebuild),
    # so it runs even when the build step failed.
    - name: Generate fresh fixtures
      id: fixtures
      continue-on-error: true
      timeout-minutes: 90
      run: ./prepareTestResults.sh

    # A separate step from generation on purpose. `prepareTestResults.sh`
    # tolerates failing tests (`|| true`), which also swallows a simulator
    # disappearing mid-run: xcodebuild still leaves a stub .xcresult behind and
    # the script exits 0. Verifying separately keeps "generation blew up" and
    # "generation produced empty bundles" as distinguishable faults in the
    # report below, and everything downstream — the suite, the render, and the
    # cache save — now hangs off this step rather than off generation, so a
    # stub can neither produce confusing downstream failures nor be saved under
    # a key test.yml would restore (#454).
    - name: Verify fresh fixtures
      id: verify
      if: steps.fixtures.outcome == 'success'
      continue-on-error: true
      run: ./scripts/verify_fixtures.sh

    - name: Run test suite
      id: tests
      if: steps.verify.outcome == 'success'
      continue-on-error: true
      timeout-minutes: 45
      run: swift test -v

    # The issue's core signal: since 3.0 the tool exits 3 when the report is
    # degraded (collected faults); any other non-zero exit is a hard error,
    # not degradation. A clean exit against a bundle produced by this exact
    # toolchain is the whole assertion. The exit code is captured as a step
    # output so the drift report can tell those two failures apart.
    #
    # No `mkdir -p` here: #445 added one to stop a missing --output directory
    # from being misreported as toolchain drift, and #446 fixed the tool to
    # create the directory itself. Pointing at an uncreated path is now part
    # of what this step asserts — restoring the mkdir would hide a regression.
    - name: Run xchtmlreport against a fresh bundle
      id: tool
      if: steps.build.outcome == 'success' && steps.verify.outcome == 'success'
      continue-on-error: true
      timeout-minutes: 15
      run: |
        exit_code=0
        swift run xchtmlreport \
          Tests/XCTestHTMLReportTests/Resources/TestResults.xcresult \
          --output "$RUNNER_TEMP/drift-report" || exit_code=$?
        echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
        if [ "$exit_code" -ne 0 ]; then
          echo "::error::xchtmlreport exited with code ${exit_code}"
          exit "$exit_code"
        fi

    # This job regenerated fixtures for the newest toolchain anyway, so save
    # them under the same key test.yml computes (#436): after a toolchain bump
    # on the runners, PR jobs start from a warm cache instead of each paying
    # for regeneration. Saving is a side effect, never an input — nothing in
    # this workflow restores from the cache. The key was computed by the
    # shared action before generation, so it matches test.yml's clean-tree
    # restore key exactly.
    #
    # Gated on the verify step, not on generation: this is the one place a stub
    # bundle would do lasting damage, poisoning every PR run that hits the key
    # until it rotates (#454). Verify only runs when generation succeeded, so
    # its success implies both.
    #
    # Stable leg only. Poisoning across legs is already impossible — the key
    # embeds the Xcode build, so beta fixtures land under
    # `fixtures-xcode27.0-…` while test.yml looks up `fixtures-xcode26.x-…`,
    # and test.yml has no restore-keys for a prefix match to sneak through. The
    # beta entry is skipped because it is dead weight: nothing can ever restore
    # it, and it counts against the repo's 10 GB cache budget, where its only
    # possible effect is pushing the *useful* stable entry closer to LRU
    # eviction.
    - name: Save fixtures to cache
      if: matrix.channel == 'stable' && steps.fixture-key.outcome == 'success' && steps.verify.outcome == 'success'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          Tests/XCTestHTMLReportTests/Resources/TestResults.xcresult
          Tests/XCTestHTMLReportTests/Resources/SanityResults.xcresult
          Tests/XCTestHTMLReportTests/Resources/RetryResults.xcresult
        key: ${{ steps.fixture-key.outputs.key }}

    # Turns step outcomes into a filed issue, so a broken scheduled run cannot
    # rot unseen in the Actions tab. One open issue per label collects repeat
    # failures as comments; a later green run comments on it too, so the
    # maintainer can tell a persistent break from a resolved one.
    #
    # One step serves both legs, parameterised by `matrix.issue_label` and
    # `matrix.channel`. A second copy for the beta leg is exactly how the two
    # would drift apart, and the dedup and green-comment behaviour is the part
    # that must not (#454). What the channel changes: which label is searched
    # and filed under, the issue title, the banner that opens a beta body, and
    # whether the step exits non-zero at the end.
    #
    # `!cancelled()` rather than `always()`: a manually cancelled run is not
    # drift and must not file anything.
    - name: Report drift
      if: ${{ !cancelled() }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        CHANNEL: ${{ matrix.channel }}
        RUNNER_LABEL: ${{ matrix.runner }}
        ISSUE_LABEL: ${{ matrix.issue_label }}
        XCODE: ${{ steps.toolchain.outputs.xcode }}
        XCRESULTTOOL: ${{ steps.toolchain.outputs.xcresulttool }}
        LEGACY: ${{ steps.legacy.outcome }}
        BUILD: ${{ steps.build.outcome }}
        FIXTURES: ${{ steps.fixtures.outcome }}
        VERIFY: ${{ steps.verify.outcome }}
        TESTS: ${{ steps.tests.outcome }}
        TOOL: ${{ steps.tool.outcome }}
        TOOL_EXIT: ${{ steps.tool.outputs.exit_code }}
      run: |
        faults=()
        if [ "$LEGACY" = "failure" ]; then
          faults+=("**Legacy \`xcresulttool\` marker vanished.** \`xcrun xcresulttool version\` no longer reports a \`legacy commands format version\`, meaning Apple has likely removed the \`--legacy\` command surface. The #391 migration loses its differential baseline the moment this toolchain reaches users — treat as urgent.")
        elif [ "$LEGACY" != "success" ]; then
          # The probe runs under `!cancelled()`, so this should be impossible;
          # if it happens anyway, say so rather than reporting only a generic
          # setup fault while the one alarm that matters went unevaluated.
          faults+=("Legacy \`xcresulttool\` probe did not run (outcome: ${LEGACY:-unknown}) — the legacy alarm was NOT evaluated this run; see the run log.")
        fi
        if [ "$BUILD" = "failure" ]; then
          faults+=("\`swift build\` failed on this toolchain.")
        fi
        if [ "$FIXTURES" = "failure" ]; then
          faults+=("Fixture generation (\`prepareTestResults.sh\`) failed on this toolchain.")
        elif [ "$FIXTURES" = "skipped" ]; then
          faults+=("Run aborted before fixture generation — a setup step failed; see the run log.")
        fi
        if [ "$VERIFY" = "failure" ]; then
          faults+=("Fixture generation reported success but produced a bundle with no test data — the run log names it. Usually the runner's simulator went away mid-run and \`xcodebuild\` left a stub \`.xcresult\` behind (#454). Nothing was saved to the fixture cache, and the signals below were skipped because they would only have failed confusingly against the stub.")
        fi
        if [ "$TESTS" = "failure" ]; then
          faults+=("\`swift test\` failed against freshly generated fixtures.")
        fi
        if [ "$TOOL" = "failure" ]; then
          if [ "$TOOL_EXIT" = "3" ]; then
            faults+=("\`xchtmlreport\` exited 3 against a fresh \`.xcresult\` — since 3.0 that means the report degraded (collected faults).")
          else
            faults+=("\`xchtmlreport\` failed against a fresh \`.xcresult\` with a hard error (exit ${TOOL_EXIT:-unknown}) — not fault degradation; see the run log.")
          fi
        fi

        {
          echo "### Toolchain"
          echo "- Channel: ${CHANNEL} (\`runs-on: ${RUNNER_LABEL}\`)"
          echo "- Xcode: ${XCODE}"
          echo "- xcresulttool: \`${XCRESULTTOOL}\`"
          echo
          echo "### Step outcomes"
          echo "| Step | Outcome |"
          echo "| --- | --- |"
          echo "| legacy xcresulttool marker | ${LEGACY} |"
          echo "| swift build | ${BUILD} |"
          echo "| fixture generation | ${FIXTURES} |"
          echo "| fixtures contain test data | ${VERIFY} |"
          echo "| swift test | ${TESTS} |"
          echo "| xchtmlreport clean exit | ${TOOL} |"
        } > "$RUNNER_TEMP/summary.md"
        cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

        # Scoped to this leg's label, so the beta leg can never comment on,
        # reopen or resolve the stable `drift` issue — the one alarm whose
        # trustworthiness the whole design is protecting.
        open_issue="$(gh issue list --repo "$REPO" --label "$ISSUE_LABEL" --state open \
          --json number --jq '.[0].number // empty')"

        if [ "${#faults[@]}" -eq 0 ]; then
          echo "No drift detected."
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --repo "$REPO" \
              --body "Latest scheduled ${CHANNEL} drift run passed on Xcode ${XCODE} — this may be resolved. (${RUN_URL})"
          fi
          exit 0
        fi

        if [ "$CHANNEL" = "beta" ]; then
          issue_title="Beta toolchain drift detected (Xcode ${XCODE})"
          label_color=FBCA04
          label_description="Xcode beta drift detected by scheduled CI — advance notice, not a regression"
        else
          issue_title="Toolchain drift detected (Xcode ${XCODE})"
          label_color=D93F0B
          label_description="Toolchain drift detected by scheduled CI"
        fi

        {
          if [ "$CHANNEL" = "beta" ]; then
            echo "> [!WARNING]"
            echo "> **This is a beta toolchain report — advance notice, not a regression.**"
            echo "> It comes from the \`${RUNNER_LABEL}\` preview runner image, whose default Xcode is a"
            echo "> pre-release beta (${XCODE}). Nothing here blocks a merge, reddens a run, or means the"
            echo "> shipping toolchain is broken — that is tracked separately under the \`drift\` label."
            echo "> Beta failures are expected to be noisy, especially in the weeks after WWDC. Read this"
            echo "> as roughly two months of warning about what Xcode GA will bring to \`macos-latest\`."
            echo
            echo "A [beta toolchain drift run](${RUN_URL}) failed against a pre-release Xcode. Each item below is an independent failure signal."
          else
            echo "A scheduled [toolchain drift run](${RUN_URL}) failed against the newest Xcode available on the runners. Each item below is an independent failure signal."
          fi
          echo
          for fault in "${faults[@]}"; do
            echo "- ${fault}"
          done
          echo
          cat "$RUNNER_TEMP/summary.md"
          echo
          echo "_Filed automatically by the \`toolchain-drift\` workflow (#392). While this issue stays open, later failing runs append comments here instead of filing duplicates._"
        } > "$RUNNER_TEMP/issue.md"

        if [ -n "$open_issue" ]; then
          gh issue comment "$open_issue" --repo "$REPO" --body-file "$RUNNER_TEMP/issue.md"
        else
          gh label create "$ISSUE_LABEL" --repo "$REPO" --force \
            --description "$label_description" --color "$label_color"
          gh issue create --repo "$REPO" --label "$ISSUE_LABEL" \
            --title "$issue_title" \
            --body-file "$RUNNER_TEMP/issue.md"
        fi

        # The issue is the durable signal; on the stable leg the red run is the
        # ambient one. The beta leg exits 0 instead: the job is already
        # continue-on-error, so failing here as well would add nothing but a
        # red step inside a run that is green by design.
        if [ "$CHANNEL" = "stable" ]; then
          exit 1
        fi
