name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# These jobs only read the tree. The repository default is write, so scope the
# token down explicitly rather than inheriting more than is needed.
permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Pins shellcheck to the version in mise.toml -- the one the local
    # pre-commit hook also runs -- rather than whatever the runner image ships.
    - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      with:
        install_args: shellcheck

    # prepareTestResults.sh is load-bearing: CI and every contributor run it to
    # generate the test fixtures, and nothing checked it before.
    - name: ShellCheck
      run: |
        shellcheck --version
        find . -name '*.sh' -not -path './.build/*' -print0 | xargs -0 -r shellcheck

    # assemble_site.py decides whether the Pages deployment goes out, and its
    # failure mode is a green run that deletes published releases. It rides in
    # this job because the tests are stdlib-only: no runner, toolchain or
    # dependency beyond the python3 already on the image.
    - name: Site assembler tests
      run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  actions:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # The token only feeds zizmor's online audits (known-vulnerable-actions,
    # stale hash pins); the job never writes. Informational findings are
    # filtered out so the gate starts green — raise the floor deliberately,
    # like the SwiftLint config below.
    # The version pin lives in mise.toml now, alongside every other tool this
    # repository runs, rather than inline in a pipx invocation.
    - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      with:
        install_args: zizmor

    - name: zizmor
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: zizmor --min-severity low .github/workflows/

  swift:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Pinned by mise.toml. This was `brew install swiftformat swiftlint`, which
    # gave CI whatever version Homebrew had that morning while contributors ran
    # whatever they had installed, so a formatter release could redden a pull
    # request that changed nothing. Homebrew has no versioned formulae for
    # either tool, so the pin has to live somewhere else.
    - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      with:
        install_args: swiftformat swiftlint

    - name: SwiftFormat
      run: swiftformat --lint --reporter github-actions-log .

    # Non-strict on purpose: warnings are surfaced, only violations configured
    # as errors fail the build. The config starts green so the gate is trusted,
    # and is meant to be tightened deliberately rather than switched on already
    # failing and then ignored.
    - name: SwiftLint
      run: swiftlint lint --reporter github-actions-logging
