name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# These jobs only read the tree. The repository default is write, so scope the
# token down explicitly rather than inheriting more than is needed.
permissions:
  contents: read

# A push to a pull request makes the run for the previous push worthless, so
# cancel it rather than let it hold a runner to the end. Only runs of the same
# pull request share a group. Everything else -- a push to `main`, a manual
# dispatch -- gets a group of its own, keyed on the run id, so it neither
# cancels nor waits behind anything. A shared group for `main` would not do,
# even with cancel-in-progress off: GitHub keeps one pending run per group and
# cancels the older one when a third arrives, so merges landing close together
# would lose a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# mise.toml's postinstall hook installs the git pre-commit hook, which is
# meaningless on an ephemeral runner. Worse, these jobs install only the tools
# they need, so `hk` is absent and the hook exits 127; mise treats that as a
# warning and carries on, but a warning present in every run is a warning
# nobody reads, and it would mask a postinstall failure that did matter.
# `--no-hooks` is a global mise flag rather than a `mise install` option, so it
# cannot be passed through the action's install_args -- this is the env form of
# the same switch.
env:
  MISE_NO_HOOKS: 1

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Pins shellcheck to the version in mise.toml -- the one the local
    # pre-commit hook also runs -- rather than whatever the runner image ships.
    - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      with:
        install_args: shellcheck

    # prepareTestResults.sh is load-bearing: CI and every contributor run it to
    # generate the test fixtures, and nothing checked it before.
    - name: ShellCheck
      run: |
        shellcheck --version
        find . -name '*.sh' -not -path './.build/*' -print0 | xargs -0 -r shellcheck

    # assemble_site.py decides whether the Pages deployment goes out, and its
    # failure mode is a green run that deletes published releases. It rides in
    # this job because the tests are stdlib-only: no runner, toolchain or
    # dependency beyond the python3 already on the image.
    - name: Site assembler tests
      run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

    # CLAUDE.md's line cap and the learnings index (scripts/check_agent_rules.py
    # says why). Its tests ride in the step above; this runs it on the tree.
    - name: Agent rules
      run: python3 scripts/check_agent_rules.py

  actions:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # The token only feeds zizmor's online audits (known-vulnerable-actions,
    # stale hash pins); the job never writes. Informational findings are
    # filtered out so the gate starts green — raise the floor deliberately,
    # like the SwiftLint config below.
    # The version pin lives in mise.toml now, alongside every other tool this
    # repository runs, rather than inline in a pipx invocation.
    - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      with:
        # actionlint by the backend name mise.toml pins it under. The short
        # name is a different tool as far as mise is concerned: it installs
        # the latest release beside the pin and leaves the shim unresolved.
        install_args: zizmor aqua:rhysd/actionlint shellcheck

    - name: zizmor
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: zizmor --min-severity low .github/workflows/

    # zizmor audits what a workflow is allowed to do; actionlint checks that it
    # says what it means -- expressions that reference something undefined,
    # misspelled keys, and the shell in every `run:` block, which it hands to
    # shellcheck. That is why shellcheck is installed in this job too: without
    # the pinned one on PATH, actionlint would use whichever the runner image
    # ships, or quietly skip the shell checks if it found none (#465).
    - name: actionlint
      run: |
        actionlint -version
        actionlint

  swift:
    runs-on: macos-latest
    # Under a minute in practice. The default is six hours.
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Pinned by mise.toml. This was `brew install swiftformat swiftlint`, which
    # gave CI whatever version Homebrew had that morning while contributors ran
    # whatever they had installed, so a formatter release could redden a pull
    # request that changed nothing. Homebrew has no versioned formulae for
    # either tool, so the pin has to live somewhere else.
    - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      with:
        install_args: swiftformat swiftlint

    - name: SwiftFormat
      run: swiftformat --lint --reporter github-actions-log .

    # Non-strict on purpose: warnings are surfaced, only violations configured
    # as errors fail the build. The config starts green so the gate is trusted,
    # and is meant to be tightened deliberately rather than switched on already
    # failing and then ignored.
    - name: SwiftLint
      run: swiftlint lint --reporter github-actions-logging
