name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Only reads the tree. The repository default is write, so scope the token
# down explicitly rather than inheriting more than is needed.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Newest toolchain, plus one major version back — the pattern this
        # matrix has followed since 2023. The older leg needs its own image:
        # macos-latest is now macos-26, which ships only Xcode 26.x.
        include:
          - os: macos-latest
            xcode_version: latest-stable
          - os: macos-15
            xcode_version: "16"
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Setup Xcode version
      uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0        
      with:
        xcode-version: ${{ matrix.xcode_version }}

    - name: Build
      run: swift build -v -c release --triple arm64-apple-macosx
