name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Newest toolchain, plus one major version back — the pattern this
        # matrix has followed since 2023. The older leg needs its own image:
        # macos-latest is now macos-26, which ships only Xcode 26.x.
        include:
          - os: macos-latest
            xcode_version: latest-stable
          - os: macos-15
            xcode_version: "16"
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Xcode version
      uses: maxim-lobanov/setup-xcode@v1.6.0        
      with:
        xcode-version: ${{ matrix.xcode_version }}

    - name: Build
      run: swift build -v -c release --triple arm64-apple-macosx
