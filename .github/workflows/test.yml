name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

# Only reads the tree. The repository default is write, so scope the token
# down explicitly rather than inheriting more than is needed.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Setup Xcode version
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    - name: Generate test fixtures
      run: ./prepareTestResults.sh

    - name: Run tests
      run: swift test -v

    - name: Upload fixtures on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: xcresult-fixtures
        path: Tests/XCTestHTMLReportTests/Resources
        retention-days: 7
