name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

# Only reads the tree. The repository default is write, so scope the token
# down explicitly rather than inheriting more than is needed.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Xcode version
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    # Fixture generation boots a simulator and runs the sample app's UI tests;
    # it dominates this job's wall time (#412). The bundles are deterministic
    # for a given toolchain and sample app (#423/#430), and every assertion in
    # the suite compares within one run, so identical bytes are safe to reuse
    # across runs. The key captures everything that shapes the bundles: the
    # exact Xcode build, the newest installed iOS simulator runtime (which
    # prepareTestResults.sh selects), the script itself, and the sample-app
    # sources. Any toolchain bump — including `latest-stable` moving under us —
    # changes the key and forces regeneration, which the drift detector (#392)
    # depends on: fixtures must always reflect the current toolchain.
    - name: Compute fixture cache key
      id: fixture-key
      run: |
        xcode="$(xcodebuild -version | awk 'NR==1 {v=$2} NR==2 {b=$3} END {printf "%s-%s", v, b}')"
        runtime="$(xcrun simctl list runtimes iOS available --json | python3 -c '
        import json, sys
        runtimes = json.load(sys.stdin)["runtimes"]
        best = max(runtimes, key=lambda r: [int(p) for p in r["version"].split(".")])
        print(best["version"] + "-" + best["buildversion"])
        ')"
        echo "toolchain=xcode${xcode}-ios${runtime}" >> "$GITHUB_OUTPUT"

    # No restore-keys, deliberately: a partial match would serve fixtures
    # generated by a different toolchain or sample app. Exact hit or regenerate.
    - name: Restore cached fixtures
      id: fixture-cache
      uses: actions/cache@v4
      with:
        path: |
          Tests/XCTestHTMLReportTests/Resources/TestResults.xcresult
          Tests/XCTestHTMLReportTests/Resources/SanityResults.xcresult
          Tests/XCTestHTMLReportTests/Resources/RetryResults.xcresult
        key: fixtures-${{ steps.fixture-key.outputs.toolchain }}-${{ hashFiles('prepareTestResults.sh', 'XCTestHTMLReportSampleApp/**') }}

    - name: Generate test fixtures
      if: steps.fixture-cache.outputs.cache-hit != 'true'
      run: ./prepareTestResults.sh

    # Restored or freshly generated, the bundles must actually exist before
    # the fast path is trusted: a cache hit that restored nothing would
    # otherwise sail through as a suspiciously quick green run.
    - name: Verify fixtures
      run: |
        for bundle in TestResults SanityResults RetryResults; do
          plist="Tests/XCTestHTMLReportTests/Resources/${bundle}.xcresult/Info.plist"
          if [ ! -f "$plist" ]; then
            echo "::error::missing or incomplete fixture: ${bundle}.xcresult"
            exit 1
          fi
        done

    - name: Run tests
      run: swift test -v

    - name: Upload fixtures on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: xcresult-fixtures
        path: Tests/XCTestHTMLReportTests/Resources
        retention-days: 7
