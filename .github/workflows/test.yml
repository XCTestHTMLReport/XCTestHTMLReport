name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

# Only reads the tree. The repository default is write, so scope the token
# down explicitly rather than inheriting more than is needed.
permissions:
  contents: read

# A push to a pull request makes the run for the previous push worthless, so
# cancel it rather than let it hold a runner to the end. Only runs of the same
# pull request share a group. Everything else -- a push to `main`, a manual
# dispatch -- gets a group of its own, keyed on the run id, so it neither
# cancels nor waits behind anything. A shared group for `main` would not do,
# even with cancel-in-progress off: GitHub keeps one pending run per group and
# cancels the older one when a third arrives, so merges landing close together
# would lose a verdict -- and here the fixture cache too, which is saved post-job.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Decides whether the Xcode preview legs below exist, on a free ubuntu runner
  # in ~10s, so a retired `xcode-<N>` label can never park a macOS job in the
  # queue and leave a pull request's checks pending forever. The shared action
  # explains the hazard; toolchain-drift.yml uses it too, with one difference
  # that matters.
  #
  # The drift workflow takes the newest preview image whatever it holds,
  # because watching a beta is its job. A pull request must not: it asks for
  # the newest image whose default Xcode is a *release* (`require: release`).
  # So when an `xcode-28` image appears holding a beta, these legs stay on
  # Xcode 27 for as long as that image is served, and move to 28 when its
  # default becomes a release — never showing a pull request a red leg for a
  # toolchain nobody can ship on.
  #
  # XCODE_PR_PREVIEW_RUNNER is these legs' own switch, separate from the drift
  # workflow's XCODE_BETA_RUNNER so that turning one off leaves the other
  # running: set the repository variable to `off` to drop the preview legs
  # from pull requests, or to a runner label to pin them to one image.
  discover:
    runs-on: ubuntu-latest
    # The preview legs are extra coverage. Nothing about finding them may cost
    # a pull request its `macos-latest` legs, so a failure here is tolerated
    # and `test` below falls back to exactly the matrix it had before.
    continue-on-error: true
    outputs:
      matrix: ${{ steps.legs.outputs.matrix }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Discover the Xcode preview runner
      id: preview
      uses: ./.github/actions/discover-preview-runner
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        require: release
        override: ${{ vars.XCODE_PR_PREVIEW_RUNNER }}

    - name: Decide which legs run
      id: legs
      env:
        LABEL: ${{ steps.preview.outputs.label }}
        SKIP_REASON: ${{ steps.preview.outputs.skip-reason }}
      run: |
        # `suffix` is empty on the two `macos-latest` legs on purpose: it keeps
        # their job names exactly `test (auto)` and `test (modern)`, which are
        # the names branch protection requires. Renaming them would leave every
        # pull request waiting on two checks that no longer report.
        # The artifact names of those two legs stay as they were for the same
        # reason, in case anything downloads them by name.
        legs='{"result_reader":"auto","runner":"macos-latest","suffix":"","artifact_suffix":""}'
        legs="${legs},{\"result_reader\":\"modern\",\"runner\":\"macos-latest\",\"suffix\":\"\",\"artifact_suffix\":\"\"}"
        if [ -n "$LABEL" ]; then
          for reader in auto modern; do
            legs="${legs},{\"result_reader\":\"${reader}\",\"runner\":\"${LABEL}\",\"suffix\":\", ${LABEL}\",\"artifact_suffix\":\"-${LABEL}\"}"
          done
          echo "Xcode preview legs: \`${LABEL}\`." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Xcode preview legs skipped — ${SKIP_REASON}." >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "matrix={\"include\":[${legs}]}" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    # Run however discovery went: a failed `discover` would otherwise skip this
    # job, and with it the two checks branch protection requires.
    if: ${{ !cancelled() }}
    name: test (${{ matrix.result_reader }}${{ matrix.suffix }})
    runs-on: ${{ matrix.runner }}
    # Seven to nine minutes on a fixture cache hit. What this is sized for is a
    # miss, which adds fixture generation, and that depends on the image: about
    # sixteen minutes on `macos-latest`, around forty on a preview image, where
    # a healthy cold-cache leg has taken about fifty-six minutes end to end.
    # Timing out there would also skip the cache save and leave the next run
    # just as cold. The default is six hours, which is how long a hung
    # simulator would otherwise hold the runner.
    timeout-minutes: ${{ matrix.runner == 'macos-latest' && 45 || 75 }}
    strategy:
      fail-fast: false
      # Two axes, spelled out as legs because one of them is discovered.
      #
      # `result_reader` — `auto` is what users get. The forced `modern` leg
      # exercises the path that becomes the only path once Apple removes the
      # legacy commands — without it, the modern reader is only ever covered
      # by the differential tests, and never end to end.
      #
      # `runner` — `macos-latest` is the Xcode the image calls stable. The
      # `xcode-<N>` preview image is the next major, which reaches users months
      # before it reaches `macos-latest`: Xcode 27.1 shipped while
      # `macos-latest` was still Xcode 26, and for all of that time the only
      # thing exercising this tool on it was the twice-weekly drift run, whose
      # failures were filed as advance notice about a beta (#478). A change
      # that breaks the tool on the Xcode people have installed should fail
      # the pull request that makes it.
      #
      # The fallback is the matrix this job had before the preview legs
      # existed. Duplicated on purpose — a fallback that referenced
      # discovery's output would inherit exactly the failure it is there to
      # survive.
      matrix: ${{ fromJSON(needs.discover.outputs.matrix || '{"include":[{"result_reader":"auto","runner":"macos-latest","suffix":"","artifact_suffix":""},{"result_reader":"modern","runner":"macos-latest","suffix":"","artifact_suffix":""}]}') }}
    env:
      XCHR_RESULT_READER: ${{ matrix.result_reader }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # `macos-latest` only. The preview image's default Xcode is already the
    # active developer directory and is the one toolchain-drift.yml measures
    # and pre-warms the fixture cache for, so the preview legs take it as it
    # comes; `latest-stable` there would resolve to whichever point release the
    # image added last, which is a different question from the one asked here.
    - name: Setup Xcode version
      if: matrix.runner == 'macos-latest'
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    # Which Xcode a leg ran is otherwise only recoverable from the fixture
    # cache key, and on the preview legs it is not fixed by this file at all.
    # The license type is the Xcode's own word on whether it is a release
    # (`GM`) or not (`Beta`): discovery chose this image from its manifest,
    # and this line is where a disagreement between the two would show.
    - name: Record toolchain
      run: |
        xcodebuild -version
        xcrun xcresulttool version
        license_type="$(/usr/libexec/PlistBuddy -c 'Print :licenseType' \
          "$(xcode-select -p)/../Resources/LicenseInfo.plist" 2>/dev/null || true)"
        echo "Xcode license type: ${license_type:-unreadable}"

    # Fixture generation boots a simulator and runs the sample app's UI tests;
    # it dominates this job's wall time (#412). The bundles are deterministic
    # for a given toolchain and sample app (#423/#430), and every assertion in
    # the suite compares within one run, so identical bytes are safe to reuse
    # across runs. What goes into the key — and why it must be computed before
    # generation dirties the tree — is documented in the shared action, which
    # toolchain-drift.yml also uses to pre-warm this cache under the identical
    # key (#436, #392).
    - name: Compute fixture cache key
      id: fixture-key
      uses: ./.github/actions/fixture-cache-key

    # No restore-keys, deliberately: a partial match would serve fixtures
    # generated by a different toolchain or sample app. Exact hit or regenerate.
    - name: Restore cached fixtures
      id: fixture-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          Tests/XCTestHTMLReportTests/Resources/TestResults.xcresult
          Tests/XCTestHTMLReportTests/Resources/SanityResults.xcresult
          Tests/XCTestHTMLReportTests/Resources/RetryResults.xcresult
          Tests/XCTestHTMLReportTests/Resources/CrashResults.xcresult
        key: ${{ steps.fixture-key.outputs.key }}

    - name: Generate test fixtures
      if: steps.fixture-cache.outputs.cache-hit != 'true'
      run: ./prepareTestResults.sh

    # Restored or freshly generated, the bundles must actually contain tests
    # before the fast path is trusted: a cache hit that restored nothing would
    # otherwise sail through as a suspiciously quick green run, and a stub left
    # behind by a simulator that vanished mid-generation would fail the suite
    # below with a confusing error instead of here (#454). The script explains
    # what it asserts and why presence alone is not enough.
    #
    # This must stay ahead of `swift test`, and it is: the cache action's save
    # runs post-job under `post-if: success()`, so failing here also stops a
    # stub from being written to the cache under a key every later run would
    # restore.
    - name: Verify fixtures
      run: ./scripts/verify_fixtures.sh

    - name: Run tests
      run: swift test -v

    # A rendered report is what this tool actually ships, and until now nothing
    # in CI let a reviewer look at one — the suite only ever compares report
    # HTML as text (DifferentialTests, ReproducibilityTests). Rendering here
    # costs an incremental build plus a few seconds, because this job already
    # holds the fixtures.
    #
    # Both matrix legs render, and the job-level XCHR_RESULT_READER decides
    # which reader each one exercises, so a PR touching the templates or either
    # reader can be eyeballed per backend — the whole question during the 4.0
    # migration (#391). Names are suffixed per leg for the same reason the
    # fixture upload below is.
    - name: Render sample report
      run: |
        swift build --product xchtmlreport
        mkdir -p "$RUNNER_TEMP/report"
        .build/debug/xchtmlreport -i \
          -o "$RUNNER_TEMP/report" \
          Tests/XCTestHTMLReportTests/Resources/TestResults.xcresult

    # `-i` inlines every attachment as base64, making index.html self-contained
    # (~9 MB) so it opens straight from the download. The default linking mode
    # would emit a 460 KB file whose src attributes point back into the
    # .xcresult bundle, which is not uploaded alongside it — every screenshot,
    # video and log in the downloaded report would 404.
    - name: Upload rendered report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: report-${{ matrix.result_reader }}${{ matrix.artifact_suffix }}
        path: ${{ runner.temp }}/report/index.html
        retention-days: 14

    # Deliberately last. `if: failure()` is evaluated when the step is reached
    # and a skipped step never runs again, so this only covers the steps above
    # it: parked any earlier, a render that failed after the tests went green
    # would upload nothing at all, leaving the failure undiagnosable without
    # regenerating the bundles by hand. Keep it at the end of the job.
    - name: Upload fixtures on failure
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        # Suffixed per matrix leg: upload-artifact v4+ refuses duplicate
        # artifact names, so a run where both legs fail would otherwise lose
        # the second leg's upload.
        name: xcresult-fixtures-${{ matrix.result_reader }}${{ matrix.artifact_suffix }}
        path: Tests/XCTestHTMLReportTests/Resources
        retention-days: 7
