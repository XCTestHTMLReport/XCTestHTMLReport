name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

# Only reads the tree. The repository default is write, so scope the token
# down explicitly rather than inheriting more than is needed.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # `auto` is what users get. The forced `modern` leg exercises the path
        # that becomes the only path once Apple removes the legacy commands —
        # without it, the modern reader is only ever covered by the
        # differential tests, and never end to end.
        result_reader: [auto, modern]
    env:
      XCHR_RESULT_READER: ${{ matrix.result_reader }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Xcode version
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    # Fixture generation boots a simulator and runs the sample app's UI tests;
    # it dominates this job's wall time (#412). The bundles are deterministic
    # for a given toolchain and sample app (#423/#430), and every assertion in
    # the suite compares within one run, so identical bytes are safe to reuse
    # across runs. What goes into the key — and why it must be computed before
    # generation dirties the tree — is documented in the shared action, which
    # toolchain-drift.yml also uses to pre-warm this cache under the identical
    # key (#436, #392).
    - name: Compute fixture cache key
      id: fixture-key
      uses: ./.github/actions/fixture-cache-key

    # No restore-keys, deliberately: a partial match would serve fixtures
    # generated by a different toolchain or sample app. Exact hit or regenerate.
    - name: Restore cached fixtures
      id: fixture-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          Tests/XCTestHTMLReportTests/Resources/TestResults.xcresult
          Tests/XCTestHTMLReportTests/Resources/SanityResults.xcresult
          Tests/XCTestHTMLReportTests/Resources/RetryResults.xcresult
          Tests/XCTestHTMLReportTests/Resources/CrashResults.xcresult
        key: ${{ steps.fixture-key.outputs.key }}

    - name: Generate test fixtures
      if: steps.fixture-cache.outputs.cache-hit != 'true'
      run: ./prepareTestResults.sh

    # Restored or freshly generated, the bundles must actually contain tests
    # before the fast path is trusted: a cache hit that restored nothing would
    # otherwise sail through as a suspiciously quick green run, and a stub left
    # behind by a simulator that vanished mid-generation would fail the suite
    # below with a confusing error instead of here (#454). The script explains
    # what it asserts and why presence alone is not enough.
    #
    # This must stay ahead of `swift test`, and it is: the cache action's save
    # runs post-job under `post-if: success()`, so failing here also stops a
    # stub from being written to the cache under a key every later run would
    # restore.
    - name: Verify fixtures
      run: ./scripts/verify_fixtures.sh

    - name: Run tests
      run: swift test -v

    # A rendered report is what this tool actually ships, and until now nothing
    # in CI let a reviewer look at one — the suite only ever compares report
    # HTML as text (DifferentialTests, ReproducibilityTests). Rendering here
    # costs an incremental build plus a few seconds, because this job already
    # holds the fixtures.
    #
    # Both matrix legs render, and the job-level XCHR_RESULT_READER decides
    # which reader each one exercises, so a PR touching the templates or either
    # reader can be eyeballed per backend — the whole question during the 4.0
    # migration (#391). Names are suffixed per leg for the same reason the
    # fixture upload below is.
    - name: Render sample report
      run: |
        swift build --product xchtmlreport
        mkdir -p "$RUNNER_TEMP/report"
        .build/debug/xchtmlreport -i \
          -o "$RUNNER_TEMP/report" \
          Tests/XCTestHTMLReportTests/Resources/TestResults.xcresult

    # `-i` inlines every attachment as base64, making index.html self-contained
    # (~9 MB) so it opens straight from the download. The default linking mode
    # would emit a 460 KB file whose src attributes point back into the
    # .xcresult bundle, which is not uploaded alongside it — every screenshot,
    # video and log in the downloaded report would 404.
    - name: Upload rendered report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: report-${{ matrix.result_reader }}
        path: ${{ runner.temp }}/report/index.html
        retention-days: 14

    # Deliberately last. `if: failure()` is evaluated when the step is reached
    # and a skipped step never runs again, so this only covers the steps above
    # it: parked any earlier, a render that failed after the tests went green
    # would upload nothing at all, leaving the failure undiagnosable without
    # regenerating the bundles by hand. Keep it at the end of the job.
    - name: Upload fixtures on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        # Suffixed per matrix leg: upload-artifact v4+ refuses duplicate
        # artifact names, so a run where both legs fail would otherwise lose
        # the second leg's upload.
        name: xcresult-fixtures-${{ matrix.result_reader }}
        path: Tests/XCTestHTMLReportTests/Resources
        retention-days: 7
