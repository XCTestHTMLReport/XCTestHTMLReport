name: Brew Bump

# Manual escape hatch only.
#
# xctesthtmlreport is on Homebrew's autobump list: BrewTestBot opens a
# version-bump PR against homebrew-core on its own roughly every 3 hours after
# a release, and `brew bump-formula-pr` refuses a manual bump for autobumped
# formulae. Every formula PR since 2.5.1 has been opened by BrewTestBot.
#
# This is kept only for the case where the formula leaves the autobump list
# (gains a `no_autobump!` or a skipped livecheck). It is deliberately not wired
# into the release workflow, because it would fail every release.
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: "Release tag to bump to, e.g. v4.0.0"

# Only reads the tree. The repository default is write, so scope the token
# down explicitly rather than inheriting more than is needed.
permissions:
  contents: read

jobs:
  update_brew_formula:
    runs-on: ubuntu-latest

    steps:
    - name: Resolve tag
      id: tag
      # The input reaches the shell through the environment, never through
      # ${{ }} interpolation into the script body — a dispatch input is
      # attacker-controllable by anyone with write access, and this job holds
      # the Homebrew token.
      env:
        RAW_VERSION: ${{ inputs.version }}
      run: |
        TAG="${RAW_VERSION#refs/tags/}"
        # Release tags are v-prefixed semver from 4.0.0 on: v4.0.0, or
        # v4.0.0-rc.2 for a candidate. Unprefixed tags (3.0.0, 4.0.0rc1) are
        # older than any formula this would ever be asked to move to.
        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
          echo "::error::'${TAG}' is not a release tag (expected vX.Y.Z or vX.Y.Z-<pre-release>, e.g. v4.0.0)"
          exit 1
        fi
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        echo "bumping to ${TAG}"

    - name: Update Official Homebrew formula
      uses: dawidd6/action-homebrew-bump-formula@346ef10bbd55df1c9c70fbaa6b016d26876eefb1 # v11
      with:
        token: ${{ secrets.HOMEBREW_BUMP_ACCESS_TOKEN }}
        formula: xctesthtmlreport
        tag: ${{ steps.tag.outputs.tag }}
